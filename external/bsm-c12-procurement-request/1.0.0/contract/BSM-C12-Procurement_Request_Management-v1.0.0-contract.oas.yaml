openapi: 3.0.1
info:
  title: Procurement Request Management (contract)
  description: >-
    KONTRAK API LENGKAP C12 = spec generator (1.0.0/openapi) + endpoint aksi/turunan yang ditulis
    tangan (x-bsm-implementation). Jangan dijadikan input tmfgen.


    BSM (TIF) komponen baru C12 "Permintaan pengadaan & SOW" - Proses 2 Permintaan Pengadaan & PR,
    sub-menu 1.2.1, 1.2.2, 1.2.3, 1.2.4 (checklist; berkas lewat C06/TIRTA), 1.2.8.


    Bukan TMF Open API resmi: API custom yang MENGIKUTI pola TMF v5 (Entity/Extensible, _FVO/_MVO,
    hub + listener TMF688, paging X-Total-Count) sesuai AD-07 Solution Design BSM v1.5.


    Resource tersimpan (di-generate tmfgen): ProcurementRequest, Sow (+Deliverable), RequestToCheck,
    RequestDocumentCheck, ExternalOrderCandidate (API inbound MyCarrier, TBD), ProcurementCategory,
    Currency, ExchangeRate, IncidentQuestion + IncidentQuestionnaire (temuan demo, tidak ada di
    v1.5).


    Endpoint aksi/turunan Analisis Programmer (documentChecklist, cancel, merge, requestToCheck per
    permintaan, documentCheck, incidentQuestionnaire submit/delegate, convert) TIDAK ada di file ini
    karena tmfgen akan menjadikannya tabel. Semuanya ada di kontrak lengkap
    1.0.0/contract/*-contract.oas.yaml dan diimplementasikan di *.controller.extra.ts.


    BOQ (1.2.5, C13) dan PR (1.2.7, C14) TIDAK ada di spec ini: keduanya ODA penyesuaian di atas
    TMF620 dan TMF663.


    Acuan: BSM Solution Design v1.5 (artifact 5v6Db2ZCSvtYsvahBtocwd), Analisis Programmer BSM
    (artifact 5yTjrbvUZESoXpecMrzJyL), RBAC Keycloak (artifact 8Tk2xuKrdhKMUqZHo3DErR). Draf diskusi
    7 Okt 2026.
