        - type: object
          properties:
            lineNumber:
              type: integer
              description: Nomor baris deliverable dalam SOW (> 0).
              minimum: 1
            name:
              type: string
              description: Nama deliverable.
            releaseValue:
              $ref: '#/components/schemas/Money'
            releaseValueIdr:
              $ref: '#/components/schemas/Money'
          required:
            - lineNumber
            - name
            - releaseValue
    ProcurementRequest:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          description: >-
            Permintaan pengadaan (C12, 1.2.1/1.2.3/1.2.8). Mengubah kebutuhan (program DRP
            determined, non-program, atau order MyCarrier TBD) menjadi permintaan IBL/OBL per SOW.
            Hasil akhir Proses 2: Request to Check ke procurement.
          properties:
            requestNumber:
              type: string
              description: Nomor permintaan, dibangkitkan sistem (C20 penomoran). Read-only.
            companyCode:
              $ref: '#/components/schemas/CompanyCodeRef'
            name:
              type: string
              description: Nama proyek / judul permintaan (boleh berbeda dari judul program DRP, R05).
            description:
              type: string
              description: Uraian kebutuhan.
            programScope:
              type: string
              enum:
                - IBL
                - OBL
              description: Lingkup program IBL/OBL (R09).
            sourceType:
              type: string
              enum:
                - DRP
                - NON_DRP
                - EXTERNAL_ORDER
              description: Sumber permintaan (R05 R07 A06). EXTERNAL_ORDER = hasil konversi kandidat MyCarrier.
            requesterUnit:
              $ref: '#/components/schemas/OrganizationUnitRef'
            processorUnit:
              $ref: '#/components/schemas/OrganizationUnitRef'
            fiscalYear:
              type: integer
              description: Tahun anggaran.
              minimum: 2000
            projectValue:
              $ref: '#/components/schemas/Money'
            budgetType:
              type: string
              enum:
                - CAPEX
                - OPEX
              description: Jenis anggaran.
            procurementCategory:
              $ref: '#/components/schemas/ProcurementCategoryRef'
            contractType:
              type: string
              enum:
                - KHS
                - LUMSUM
                - SP
              description: Tipe kontrak (R09). SP wajib khsAgreement.
            khsAgreement:
              $ref: '#/components/schemas/AgreementRef'
            procurementMethod:
              $ref: '#/components/schemas/ProcurementMethodRef'
            managerProcurement:
              $ref: '#/components/schemas/EmployeeRef'
            programAllocation:
              type: array
              items:
                $ref: '#/components/schemas/ProcurementProgramAllocation'
              description: >-
                Program DRP yang dirujuk (opsional; wajib >= 1 bila sourceType = DRP) beserta
                alokasi nilai (R05 R07 R60).
            relatedParty:
              type: array
              items:
                $ref: '#/components/schemas/RelatedPartyAssignment'
              description: Pihak terkait, mis. PIC Assistant.
            totalReleaseValue:
              $ref: '#/components/schemas/Money'
            state:
              $ref: '#/components/schemas/ProcurementRequestStateType'
            docCheckStatus:
              $ref: '#/components/schemas/DocCheckStatusType'
            planStatus:
              $ref: '#/components/schemas/PlanStatusType'
            sourcingStatus:
              $ref: '#/components/schemas/SourcingStatusType'
            requestToCheckCount:
              type: integer
              description: Jumlah putaran Request to Check.
              minimum: 0
            lastRequestToCheckDate:
              type: string
              format: date-time
              description: Waktu Request to Check terakhir.
            sentToProcurementDate:
              type: string
              format: date-time
              description: Waktu diserahkan ke procurement (Proses 4).
            cancellationReason:
              type: string
              description: Alasan pembatalan; wajib bila state = cancelled.
            cancellationDate:
              type: string
              format: date-time
              description: Waktu pembatalan.
            mergedInto:
              $ref: '#/components/schemas/ProcurementRequestRef'
            creationDate:
              type: string
              format: date-time
              description: Waktu permintaan dibuat.
            lastUpdate:
              type: string
              format: date-time
              description: Waktu perubahan terakhir.
            characteristic:
              type: array
              items:
                $ref: '#/components/schemas/Characteristic'
              description: Ekstensi TMF (AD-07), mis. kuesioner dampak insiden bila diputuskan dipakai.
      discriminator:
        propertyName: '@type'
        mapping:
          ProcurementRequest: '#/components/schemas/ProcurementRequest'
