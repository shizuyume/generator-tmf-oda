      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          CurrencyRef: '#/components/schemas/CurrencyRef'
      x-bsm-referredType: Currency
    ExchangeRateRef:
      type: object
      description: Referensi baris kurs sumber (resource ExchangeRate).
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          ExchangeRateRef: '#/components/schemas/ExchangeRateRef'
      x-bsm-referredType: ExchangeRate
    RequestToCheckRef:
      type: object
      description: Referensi putaran Request to Check.
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          RequestToCheckRef: '#/components/schemas/RequestToCheckRef'
      x-bsm-referredType: RequestToCheck
    DocumentRequirementRef:
      type: object
      description: >-
        Referensi jenis dokumen wajib (C06, doc.document_requirement): JUSKEB, BOQ_TKDN,
        KETERSEDIAAN_ANGGARAN, UPP.
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          DocumentRequirementRef: '#/components/schemas/DocumentRequirementRef'
      x-bsm-referredType: DocumentRequirement
    DocumentRef:
      type: object
      description: Referensi dokumen (C06, TMF667; berkas di TIRTA).
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          DocumentRef: '#/components/schemas/DocumentRef'
      x-bsm-referredType: Document
    DocumentVersionRef:
      type: object
      description: Referensi versi dokumen yang ditandai dipakai (R54).
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          DocumentVersionRef: '#/components/schemas/DocumentVersionRef'
      x-bsm-referredType: DocumentVersion
