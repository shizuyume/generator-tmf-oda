        permissionSet di Proses 4, R41).
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          properties:
            role:
              type: string
              description: Peran pihak, mis. picAssistant
            party:
              $ref: '#/components/schemas/EmployeeRef'
          required:
            - role
