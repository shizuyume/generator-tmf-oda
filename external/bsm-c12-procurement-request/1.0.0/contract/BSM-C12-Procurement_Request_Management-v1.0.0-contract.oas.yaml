components:
  schemas:
    Addressable:
      type: object
      description: Base schema for adressable entities
      properties:
        href:
          type: string
          description: Hyperlink reference
        id:
          type: string
          description: unique identifier
    Addressable_FVO:
      type: object
      description: Base schema for adressable entities
      properties:
        id:
          type: string
          description: unique identifier
    Extensible:
      type: object
      description: >-
        Base Extensible schema for use in TMForum Open-APIs - When used for in a schema it means
        that the Entity described by the schema MUST be extended with the @type
      properties:
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
      required:
        - '@type'
    Extensible_FVO:
      type: object
      description: Base Extensible schema for use in TMForum Open-APIs (create variant)
      properties:
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
      required:
        - '@type'
    Entity:
      type: object
      description: Base entity schema for use in TMForum Open-APIs. Property.
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - $ref: '#/components/schemas/Addressable'
    Entity_FVO:
      type: object
      description: Base entity schema for use in TMForum Open-APIs (create variant).
      allOf:
        - $ref: '#/components/schemas/Extensible_FVO'
        - $ref: '#/components/schemas/Addressable_FVO'
    Entity_MVO:
      type: object
      description: Base entity schema for use in TMForum Open-APIs (update variant).
      allOf:
        - $ref: '#/components/schemas/Extensible_FVO'
        - $ref: '#/components/schemas/Addressable_FVO'
    EntityRef:
      type: object
      description: Entity reference schema to be use for all entityRef class.
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          properties:
            id:
              type: string
              description: The identifier of the referred entity.
            href:
              type: string
              description: The URI of the referred entity.
            name:
              type: string
              description: Name of the referred entity.
            '@referredType':
              type: string
              description: The actual type of the target instance when needed for disambiguation.
          required:
            - id
    Money:
      type: object
      description: A base / value business entity used to represent money
      properties:
        unit:
          type: string
          description: Currency (ISO4217 norm uses 3 letters to define the currency, e.g. IDR)
        value:
          type: number
          description: Nilai uang, desimal pasti numeric(18,2) - bukan float (DDL C12).
          format: decimal
          x-db-precision: 18
          x-db-scale: 2
    Characteristic:
      type: object
      description: >-
        Describes a given characteristic of an object or entity through a name/value pair. Dipakai
        sebagai titik ekstensi TMF (AD-07).
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          properties:
            id:
              type: string
              description: Unique identifier of the characteristic
            name:
              type: string
              description: Name of the characteristic
            valueType:
              type: string
              description: Data type of the value of the characteristic
            value:
              type: string
              description: Value of the characteristic (serialised)
          required:
            - name
    Error:
      discriminator:
        propertyName: '@type'
        mapping:
          Error: '#/components/schemas/Error'
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          required:
            - code
            - reason
          properties:
            code:
              type: string
              description: >-
                Application relevant detail, defined in the API or a common list. Contoh BSM:
                RELEASE_EXCEEDS_PROJECT_VALUE, SOW_HAS_DOCUMENTS, ALREADY_CONVERTED,
                REQUEST_TO_CHECK_BLOCKED, INVALID_STATE, REASON_REQUIRED.
            reason:
              type: string
              description: Explanation of the reason for the error which can be shown to a client user.
            message:
              type: string
              description: >-
                More details and corrective actions related to the error which can be shown to a
                client user.
            status:
              type: string
              description: HTTP Error code extension
            referenceError:
              type: string
              description: URI of documentation describing the error.
      description: Used when an API throws an Error, typically with a HTTP error response-code (3xx, 4xx, 5xx)
    Hub_FVO:
      type: object
      description: >-
        Sets the communication endpoint address the service instance must use to deliver
        notification information
      required:
        - callback
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - properties:
            callback:
              type: string
              description: The callback being registered.
            query:
              type: string
              description: additional data to be passed
    Hub:
      type: object
      description: >-
        Sets the communication endpoint address the service instance must use to deliver
        notification information
      allOf:
        - $ref: '#/components/schemas/Entity'
        - properties:
            id:
              type: string
              description: Id of the listener
            callback:
              type: string
              description: The callback being registered.
            query:
              type: string
              description: additional data to be passed
          required:
            - callback
    JsonPatch:
      type: object
      description: A JSONPatch document as defined by RFC 6902
      required:
        - op
        - path
      properties:
        op:
          type: string
          enum:
            - add
            - remove
            - replace
            - move
            - copy
            - test
          description: The operation to be performed
        path:
          type: string
          description: A JSON-Pointer
        value:
          description: The value to be used within the operations.
        from:
          type: string
          description: A string containing a JSON Pointer value.
    JsonPatchOperations:
      description: JSONPatch Operations document as defined by RFC 6902
      type: array
      items:
        $ref: '#/components/schemas/JsonPatch'
    Event:
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          description: event with common attributes.
          properties:
            href:
              type: string
              description: Hyperlink reference
            id:
              type: string
              description: unique identifier
            correlationId:
              type: string
              description: The correlation id for this event.
            domain:
              type: string
              description: The domain of the event.
            title:
              type: string
              description: The title of the event.
            description:
              type: string
              description: An explnatory of the event.
            priority:
              type: string
              description: A priority.
            timeOccurred:
              type: string
              format: date-time
              description: The time the event occurred.
            source:
              $ref: '#/components/schemas/EntityRef'
            reportingSystem:
              $ref: '#/components/schemas/EntityRef'
            eventId:
              type: string
              description: The identifier of the notification.
            eventTime:
              type: string
              format: date-time
              description: Time of the event occurrence.
            eventType:
              type: string
              description: The type of the notification.
            event:
              type: object
              description: The event linked to the involved resource object
    ProcurementRequestStateType:
      type: string
      enum:
        - draft
        - preparing
        - requestToCheck
        - checking
        - readyToSourcing
        - sentToProcurement
        - completed
        - cancelled
      description: >-
        State permintaan pengadaan (C12-state). Tugas Proses 2 mencakup draft -> preparing ->
        requestToCheck; checking dst. diubah Proses 3-4. Nama tampilan v1.5 (Preparing dokumen /
        Already dokumen / Request to Check / Checking on progress) perlu konfirmasi.
    DocCheckStatusType:
      type: string
      enum:
        - notStarted
        - onProgress
        - revision
        - approved
      description: Centang pemeriksaan dokumen di daftar permintaan (R67).
    PlanStatusType:
      type: string
      enum:
        - notStarted
        - draft
        - saved
      description: Centang procurement plan di daftar permintaan (R67).
    SourcingStatusType:
      type: string
      enum:
        - notStarted
        - auto
        - done
      description: Centang sourcing; SP = auto (R67).
    SowDocumentStateType:
      type: string
      enum:
        - preparing
        - documentReady
        - requestToCheck
        - checking
        - revision
        - approved
      description: Status kelengkapan dokumen per SOW.
    RequestToCheckStateType:
      type: string
      enum:
        - submitted
        - checking
        - returned
        - approved
        - superseded
      description: State Request to Check per putaran.
    ExternalOrderCandidateStateType:
      type: string
      enum:
        - waitingUserAction
        - converted
        - rejected
        - cancelled
      description: State kandidat order eksternal (badge Menunggu Action User / Selesai).
    OrganizationUnitRef:
      type: object
      description: >-
        Referensi unit organisasi (C03, TMF632 organization). Dipakai untuk unit peminta dan unit
        pemroses.
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          OrganizationUnitRef: '#/components/schemas/OrganizationUnitRef'
      x-bsm-referredType: Organization
    EmployeeRef:
      type: object
      description: >-
        Referensi pegawai (C03, data pegawai dari SAP INT-09). Dipakai untuk PIC SOW dan manager
