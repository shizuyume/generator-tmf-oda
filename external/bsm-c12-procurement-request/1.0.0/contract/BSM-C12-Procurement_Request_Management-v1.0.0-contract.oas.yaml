      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          EmployeeRef: '#/components/schemas/EmployeeRef'
      x-bsm-referredType: Individual
    AgreementRef:
      type: object
      description: 'Referensi kontrak (C18, TMF651). Untuk SP: KHS induk yang aktif (R09 R24).'
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          AgreementRef: '#/components/schemas/AgreementRef'
      x-bsm-referredType: Agreement
    ProcurementMethodRef:
      type: object
      description: Referensi metode pengadaan (master C15). SP otomatis SURAT_PESANAN (R67).
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          ProcurementMethodRef: '#/components/schemas/ProcurementMethodRef'
      x-bsm-referredType: ProcurementMethod
    ProcurementProgramEntityRef:
      type: object
      description: Referensi program DRP berstatus determined (C11).
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          ProcurementProgramEntityRef: '#/components/schemas/ProcurementProgramEntityRef'
      x-bsm-referredType: ProcurementProgram
    ProcurementCategoryRef:
      type: object
      description: Referensi kategori pengadaan level 2 (R09).
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          ProcurementCategoryRef: '#/components/schemas/ProcurementCategoryRef'
      x-bsm-referredType: ProcurementCategory
    ProcurementRequestRef:
      type: object
      description: Referensi permintaan pengadaan.
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          ProcurementRequestRef: '#/components/schemas/ProcurementRequestRef'
      x-bsm-referredType: ProcurementRequest
    SowRef:
      type: object
      description: Referensi SOW.
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          SowRef: '#/components/schemas/SowRef'
      x-bsm-referredType: Sow
    ExternalOrderCandidateRef:
      type: object
      description: Referensi kandidat order eksternal (MyCarrier, TBD).
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          ExternalOrderCandidateRef: '#/components/schemas/ExternalOrderCandidateRef'
      x-bsm-referredType: ExternalOrderCandidate
    CompanyCodeRef:
      type: object
