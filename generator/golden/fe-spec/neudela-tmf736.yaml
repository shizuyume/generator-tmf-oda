# neudela-fe/v1 spec — TMF736 Revenue Sharing Algorithm Management (generated by tmfgen fe-spec --ui neudela)
# Template / generation come from generator/templates/fe-neudela/template.yaml.
apiVersion: neudela-fe/v1
kind: FrontendApp
app:
  meta:
    name: neudela-lab
    packageName: "@mcs/neudela-lab"
