      request:
        method: GET
        path: /partyRevSharingAlgorithm
        headers: { Content-Type: application/json, X-API-Key: "{VITE_API_KEY} (bila di-set)" }
        query:
          offset: { type: integer, from: page × pageSize }
          limit: { type: integer, from: pageSize, default: 10 }
          filter:
            type: string
            repeatable: true
            from: "search (trim, debounce 300ms) + filter panel → TMF630 JSONPath (apiClient.filters)"
            omitWhenEmpty: true
          sort: { type: string, from: sort, format: "{columnKey} | -{columnKey}", omitWhenEmpty: true }
          fields: { type: string, sent: false }
        example: "GET /tmf-api/revenueSharingAlgorithmManagement/v5/partyRevSharingAlgorithm?offset=0&limit=10&filter=$[?(@.name=~/video/i && @.lastUpdate>='2026-09-01T00:00:00.000Z')]&filter=policy[?(@.name=~/Roaming/i)]&sort=name  (URL-encoded on the wire)"
      responses:
        "200":
          headers: { X-Total-Count: "integer → total (count chip, pagination)", X-Result-Count: integer → resultCount }
          body: { array: PartyRevSharingAlgorithm }
