pages:
  # ========================================================
  # GEOGRAPHIC ADDRESS VALIDATION — list + add/edit modal + detail
  # ========================================================
  - id: geographicAddressValidation
    path: "/geographicAddressValidations"
    title: Geographic Address Validation
    icon: FileCheck
    nav:
      parent: top

    actions:
      - label: Tambah Geographic Address Validation
        variant: primary
        position: top-right
        action: open-form
        form: add
        icon: Plus

    view: list
    list:
      api: "{{api.basePath}}/geographicAddressValidation"
      method: GET
      queryParams:
        fields: ""
        offset: "{{pagination.offset}}"
        limit: "{{pagination.limit}}"
      search:
        enabled: false
        mode: none
      columns:
        - field: provideAlternative
          label: Provide Alternative
        - field: validationResult
          label: Validation Result
        - field: state
          label: State
        - field: actions
          label: ""
          type: row-actions
          items:
            - { label: Detail, icon: Eye, action: open-detail }
            - { label: Edit, icon: Pencil, action: open-form, form: edit }
      pagination:
        mode: server-side
        scheme: offset-limit
        perPageOptions: [10, 25, 50]
      emptyState:
        title: Belum ada Geographic Address Validation
        action: { label: Tambah Geographic Address Validation, open: add }

    forms:
      add:
        mode: modal
        title: Tambah Geographic Address Validation
        api:
          method: POST
          path: "{{api.basePath}}/geographicAddressValidation"
          payload:
            provideAlternative: fields.provideAlternative
            submittedGeographicAddress:
              id: fields.submittedGeographicAddressId
              href: fields.submittedGeographicAddressHref
            "@type": fields.atType
        fields:
          - name: provideAlternative
            label: Provide Alternative
            type: toggle
            required: true
          - name: submittedGeographicAddressRef
            label: Submitted Geographic Address
            type: text
            readOnly: true
            computedFrom: submittedGeographicAddressId
          - name: submittedGeographicAddressId
            label: Submitted Geographic Address ID
            type: text
            required: true
          - name: submittedGeographicAddressHref
            label: Submitted Geographic Address Href
            type: text
            readOnly: true
            computedFrom: submittedGeographicAddressId
          - name: atType
            label: "@type"
            type: text
            readOnly: true
            defaultValue: GeographicAddressValidation
        buttons:
          submit: { label: Simpan, position: footer-right, variant: primary }
          cancel: { label: Batal, variant: ghost }
      edit:
        mode: modal
        title: Edit Geographic Address Validation
        prefillFrom: detail
        api:
          method: PATCH
          path: "{{api.basePath}}/geographicAddressValidation/{id}"
          payload:
            provideAlternative: fields.provideAlternative
            validationDate: fields.validationDate
            validationResult: fields.validationResult
            alternateGeographicAddress: fields.alternateGeographicAddress
            state: fields.state
            submittedGeographicAddress:
              id: fields.submittedGeographicAddressId
              href: fields.submittedGeographicAddressHref
            validGeographicAddress:
              id: fields.validGeographicAddressId
              href: fields.validGeographicAddressHref
        fields: [ reuse: add ]
        buttons:
          submit: { label: Simpan, position: footer-right, variant: primary }
          cancel: { label: Batal, variant: ghost }

    detail:
