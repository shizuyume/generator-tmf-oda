                  text-align: "left"
      - id: form
        file: src/components/form/Form.css
        importedBy: [src/components/form/FormDialog.tsx, src/components/form/LookupPicker.tsx]
        note: "Form dialog: panel, section, grid, repeatable item, tombol tambah."
        rules:
          - select: ".fm-dialog"
            note: "Form dialog — Neudela Logistics Dashboard \"Create shipment\", on neudela tokens. NeuronModal tops out at 448px and never scrolls: widen it, pin header/footer, scroll the body. Same specificity as .neuron-modal--lg, loaded later → wins."
            decl:
              display: "flex"
              flex-direction: "column"
              max-height: "calc(100vh - 2 * var(--space-6))"
              padding: "0"
              overflow: "hidden"
          - select: ".fm-dialog--wide"
            decl:
              max-width: "{{template.components.formDialog.widths.wide}}"
          - select: ".fm-dialog--narrow"
            decl:
              max-width: "{{template.components.formDialog.widths.narrow}}"
          - select: ".fm-dialog .neuron-modal__top-bar:empty"
            note: "no icon and no ✕ → the top bar is empty"
            decl:
              display: "none"
          - select: ".fm-dialog .neuron-modal__top-bar"
            decl:
              margin: "0"
              padding: "0"
          - select: ".fm-dialog .neuron-modal__content"
            decl:
              margin: "0"
              padding: "24px 24px 4px"
          - select: ".fm-dialog .neuron-modal__title"
            decl:
              font-size: "var(--fs-text-md)"
              line-height: "1.35"
              font-weight: "var(--font-weight-semibold)"
              color: "var(--color-text-primary)"
          - select: ".fm-dialog .neuron-modal__description"
            decl:
              font-size: "var(--fs-text-xs)"
              line-height: "1.5"
              color: "var(--color-text-secondary)"
          - select: ".fm-dialog .neuron-modal__body"
            decl:
              flex: "1"
              min-height: "0"
              margin: "0"
              padding: "16px 24px 20px"
              overflow-y: "auto"
              font-size: "var(--fs-text-sm)"
              color: "var(--color-text-primary)"
          - select: ".fm-dialog .neuron-modal__footer"
            decl:
              margin: "0"
              padding: "16px 24px 20px"
              border-top: "1px solid var(--color-border)"
          - select: ".fm-actions"
            decl:
              display: "flex"
              gap: "10px"
              width: "100%"
          - select: ".fm-actions > .neuron-btn"
            decl:
              flex: "1 1 0"
              justify-content: "center"
          - select: ".fm-form"
            note: "Layout"
            decl:
              display: "flex"
              flex-direction: "column"
              gap: "20px"
          - select: ".fm-summary"
            decl:
              outline: "none"
              border-radius: "var(--radius-md)"
          - select: ".fm-summary:focus-visible"
            decl:
              box-shadow: "0 0 0 3px var(--color-danger-light)"
          - select: ".fm-section"
            decl:
              display: "flex"
              flex-direction: "column"
              gap: "10px"
          - select: ".fm-section__head"
            decl:
              display: "flex"
              align-items: "baseline"
              justify-content: "space-between"
              gap: "12px"
          - select: ".fm-section__title"
            decl:
              margin: "0"
              font-size: "var(--fs-text-sm)"
              font-weight: "var(--font-weight-medium)"
              color: "var(--color-text-primary)"
          - select: ".fm-required"
            decl:
              color: "var(--color-danger)"
          - select: ".fm-hint"
            decl:
              font-size: "var(--fs-text-xs)"
              font-weight: "var(--font-weight-regular)"
              color: "var(--color-text-tertiary)"
          - select: ".fm-grid"
            decl:
              display: "grid"
              gap: "16px"
              align-items: "start"
          - select: ".fm-grid--2"
            decl:
              grid-template-columns: "repeat(2, minmax(0, 1fr))"
          - select: ".fm-grid--3"
            decl:
              grid-template-columns: "repeat(3, minmax(0, 1fr))"
          - select: ".fm-span-2"
            decl:
              grid-column: "span 2"
          - select: ".fm-date .neuron-datepicker-popover-wrap"
            note: "Date field (NeuronDatePicker): label, width and height of the other fields"
            decl:
              display: "flex"
              width: "100%"
          - select: ".fm-date .neuron-datepicker-label"
            decl:
              font-size: "var(--fs-text-xs)"
              font-weight: "var(--font-weight-semibold)"
              color: "var(--color-text-secondary)"
          - select: ".fm-date--required .neuron-datepicker-label::after"
            note: "NeuronDatePicker has no required prop: the asterisk of .neuron-label__required"
            decl:
              content: "\"*\""
              margin-left: "var(--space-1)"
              color: "var(--color-danger)"
              font-weight: "var(--font-weight-bold)"
          - select: ".fm-date .neuron-datepicker-trigger-btn"
            decl:
              width: "100%"
              min-width: "0"
              height: "36px"
          - select: ".fm-date .neuron-datepicker-error-msg, .fm-date .neuron-datepicker-helper-msg"
            note: "the picker's message sits 8px (wrap gap) + 2px below; the other fields use ~4px"
            decl:
              margin-top: "-4px"
          - select: ".fm-checks"
            note: "Checkbox group (yes/no attributes)"
            decl:
              display: "grid"
              grid-template-columns: "repeat(auto-fill, minmax(200px, 1fr))"
              gap: "12px 16px"
              padding: "12px 14px"
              border: "1px solid var(--color-border)"
              border-radius: "var(--radius-md)"
              background: "var(--color-bg-subtle)"
          - select: ".fm-item"
            note: "Repeatable item (design: \"Stop 1\", \"Item 1\")"
            decl:
              padding: "12px 14px 14px"
              border: "1px solid var(--color-border)"
              border-radius: "var(--radius-md)"
              background: "var(--color-bg-subtle)"
          - select: ".fm-item__head"
            decl:
              display: "flex"
              align-items: "center"
              gap: "8px"
              margin-bottom: "10px"
          - select: ".fm-item__badge"
            decl:
              display: "flex"
              align-items: "center"
              justify-content: "center"
              min-width: "22px"
              height: "22px"
              padding: "0 6px"
              border: "1px solid var(--color-primary-border)"
              border-radius: "var(--radius-full)"
              background: "var(--color-primary-light)"
              color: "var(--color-nav-active-text)"
              font-size: "var(--fs-text-xs)"
              font-variant-numeric: "tabular-nums"
          - select: ".fm-item__title"
            decl:
              flex: "1"
              font-size: "13px"
              font-weight: "var(--font-weight-semibold)"
              color: "var(--color-text-primary)"
          - select: ".fm-item__remove.neuron-btn"
            decl:
              width: "28px"
              height: "28px"
              color: "var(--color-text-tertiary)"
          - select: ".fm-item__remove.neuron-btn:hover:not(:disabled)"
            decl:
              color: "var(--color-danger)"
              background: "var(--color-danger-light)"
          - select: ".fm-item .neuron-label"
            note: "smaller labels inside an item, as in the design"
            decl:
              font-size: "var(--fs-text-xs)"
              color: "var(--color-text-secondary)"
          - select: ".fm-add"
            decl:
              display: "inline-flex"
              align-items: "center"
              justify-content: "center"
              gap: "8px"
              height: "40px"
              border: "1px dashed var(--color-border)"
              border-radius: "var(--radius-md)"
              background: "var(--color-bg-surface)"
              color: "var(--color-nav-active-text)"
              font: "inherit"
              font-size: "var(--fs-text-sm)"
              font-weight: "var(--font-weight-medium)"
              cursor: "pointer"
          - select: ".fm-add:hover"
            decl:
              border-color: "var(--color-primary)"
              background: "var(--color-primary-light)"
          - select: ".fm-add:focus-visible"
            decl:
              outline: "2px solid var(--color-primary)"
              outline-offset: "2px"
          - select: ".fm-empty"
            decl:
              margin: "0"
              font-size: "var(--fs-text-sm)"
              color: "var(--color-text-tertiary)"
          - select: ".fm-json textarea"
            note: "JSON attribute: monospace text, checked on entry"
            decl:
              font-family: "var(--lab-font-mono)"
              font-size: "var(--fs-text-xs)"
              line-height: "1.5"
          - select: ".fm-sublist"
            note: "A list inside a list item (e.g. a characteristic's values)"
            decl:
              display: "flex"
              flex-direction: "column"
              gap: "var(--space-2)"
              margin-top: "var(--space-3)"
              padding-top: "var(--space-3)"
              border-top: "1px dashed var(--color-border)"
          - select: ".fm-sublist__head"
            decl:
              display: "flex"
              align-items: "baseline"
              justify-content: "space-between"
              gap: "var(--space-2)"
          - select: ".fm-sublist__title"
            decl:
              font-size: "var(--fs-text-sm)"
              font-weight: "var(--font-weight-semibold)"
              color: "var(--color-text-primary)"
          - select: ".fm-sublist .fm-item"
            decl:
              background: "var(--color-bg-surface)"
          - select: ".lp-trigger"
            note: "LookupPicker: an async-search relation picker in NeuronDropdown's look"
            decl:
              cursor: "text"
          - select: ".lp-input"
            decl:
              height: "100%"
              cursor: "text"
          - select: ".lp-spinner"
            decl:
              flex-shrink: "0"
              color: "var(--color-text-tertiary)"
              animation: "lp-spin 0.9s linear infinite"
          - keyframes: lp-spin
            frames:
              - select: "to"
                decl:
                  transform: "rotate(360deg)"
          - media: "(prefers-reduced-motion: reduce)"
            rules:
              - select: ".lp-spinner"
                decl:
                  animation: "none"
          - select: ".lp-clear"
            decl:
              all: "unset"
              display: "inline-flex"
              flex-shrink: "0"
              padding: "2px"
              border-radius: "var(--radius-sm)"
              color: "var(--color-text-tertiary)"
              cursor: "pointer"
          - select: ".lp-clear:hover"
            decl:
              color: "var(--color-text-primary)"
          - select: ".lp-clear:focus-visible"
            decl:
              outline: "2px solid var(--color-primary)"
              outline-offset: "1px"
          - select: ".lp-status--error"
            decl:
              color: "var(--color-danger)"
          - select: ".lp-more"
            decl:
              padding: "var(--space-2) var(--space-3)"
              border-top: "1px solid var(--color-border)"
              font-size: "var(--fs-text-xs)"
              color: "var(--color-text-tertiary)"
          - media: "(max-width: {{template.layout.breakpoints.formStack}})"
            rules:
              - select: ".fm-grid--2, .fm-grid--3"
                decl:
                  grid-template-columns: "1fr"
              - select: ".fm-span-2"
                decl:
                  grid-column: "auto"
              - select: ".fm-dialog .neuron-modal__content, .fm-dialog .neuron-modal__body, .fm-dialog .neuron-modal__footer"
                decl:
                  padding-left: "16px"
                  padding-right: "16px"

# -------------------------------------------------------------------------------------
# APP — bagian per-aplikasi. Contoh: TMF736 Revenue Sharing Algorithm Management.
# Untuk domain lain (TMF ODA lain atau non-TMF), ganti seluruh blok ini.
# Bentuknya = data yang dibaca emitter generator (generator/src/fe/neudela/emitApp.mjs):
#   pages.<key>.config  = ResourceConfig (src/resource/types.ts) apa adanya → src/pages/<dir>/config.ts
#   pages.home.summary  = data Overview → src/app/summary.ts
#   services / lookups / navigation / brand / environment → src/app/*, vite.config.ts, .env.*
#   schemas             = TypeScript types → src/types/<typesFile>.ts
#   mock                = data dev:mock → mock/seed.ts
#   operations / events / errorResponses = kontrak request & response (dokumentasi + sumber Overview)
# Ekspresi nilai (Expr) di config: { path } | { pick } | { count } | { join } | { dateTime } |
# { relativeTime } | { text } | { ifAny } | { plural } | { format } | { parts } | { sumCount }
# — diinterpretasi oleh src/resource/expr.ts.
# -------------------------------------------------------------------------------------
app:
  meta:
    name: neudela-lab
    packageName: "@mcs/neudela-lab"
    version: "0.1.0"
    uiLang: en
    title: Neudela Lab
    description: Neudela Lab - TMF736 Revenue Sharing Algorithm UI on the neudela design system
    packageDescription: "design-lab prototype: TMF736 Revenue Sharing Algorithm UI rebuilt on the neudela design system (Vite, full app, MFE-ready structure). Mirrors design-lab/revenue-sharing-algorithm and feeds the fe-gen neudela adapter."
    favicon: { href: /favicon.svg, type: image/svg+xml }
    typesFile: partyRevSharingAlgorithm
  tmf:
    number: "736"
    specTitle: Revenue Sharing Algorithm Management
    specVersion: "5.0.0"
    description: Revenue Sharing Algorithm Management API goal is to provide the Algorithm to calculate a revenue share.
    oas: documents/tmf736/5.0.0/openapi/TMF736-Revenue_Sharing_Algorithm_Management-v5.0.0.oas.yaml
  brand: { logoLetter: "N", title: Neudela Lab, caption: TMF736 Revenue Sharing Algorithm Management }
  api: { basePath: /tmf-api/revenueSharingAlgorithmManagement/v5, authHeader: X-API-Key }
  environment:
    port: 4010
    apiProxyTargetDefault: "http://localhost:3736"
    lookupMockBase: /mock-policy-api
    variables:
      - name: VITE_API_BASE_URL
        value: ""
        comment: "Base URL prepended to /tmf-api/... calls. Empty = same origin, which the Vite\ndev server proxies to API_PROXY_TARGET."
      - name: API_PROXY_TARGET
        value: "http://localhost:3736"
        comment: "Where `npm run dev` proxies /tmf-api (the TMF736 backend). Read by vite.config.ts only."
      - { name: VITE_API_KEY, value: "", comment: Sent as X-API-Key when set. }
      - name: VITE_POLICY_API_BASE_URL
        value: ""
        comment: Policy Management service backing the relation pickers. Unset = pickers explain that it is not connected.
    mock: [{ name: VITE_POLICY_API_BASE_URL, value: /mock-policy-api }]
  navigation:
    - { path: /, label: Overview, icon: LayoutDashboard, page: home }
    - path: /party-rev-sharing-algorithm
      label: Revenue Sharing Algorithms
      icon: Percent
      page: partyRevSharingAlgorithm
    - { path: /hub, label: Event Hub, icon: BellRing, page: hub }
  services:
    - name: partyRevSharingAlgorithmService
      path: /partyRevSharingAlgorithm
      type: PartyRevSharingAlgorithm
      create: PartyRevSharingAlgorithm_FVO
      update: PartyRevSharingAlgorithm_MVO
    - { name: hubService, path: /hub, type: Hub, create: Hub_FVO }
  lookups:
    apis:
      policyManagement:
        service: Policy Management
        baseUrlEnv: VITE_POLICY_API_BASE_URL
        basePath: /tmf-api/policyManagement/v5
        queryParam: name
        limit: 20
        labelField: name
        valueField: id
    items:
      policy: { api: policyManagement, path: /policy, noun: policies, ref: PolicyRef }
      policyCondition:
        api: policyManagement
        path: /policyCondition
        noun: policy conditions
        ref: PolicyConditionRef
      policyVariable: { api: policyManagement, path: /policyVariable, noun: policy variables, ref: PolicyVariableRef }
      policyAction: { api: policyManagement, path: /policyAction, noun: policy actions, ref: PolicyActionRef }
  schemas:
    PolicyRef:
      kind: ref
      properties:
        id: { type: string, required: true }
        href: { type: string, serverManaged: true }
        name: { type: string }
        version: { type: string }
        "@type": { type: string }
        "@baseType": { type: string }
        "@schemaLocation": { type: string }
        "@referredType": { type: string }
      tmf: { "@type": PolicyRef, "@referredType": Policy }
    PolicyConditionRef:
      kind: ref
      properties:
        id: { type: string, required: true }
        href: { type: string, serverManaged: true }
        name: { type: string }
        "@type": { type: string }
        "@baseType": { type: string }
        "@schemaLocation": { type: string }
        "@referredType": { type: string }
      tmf: { "@type": PolicyConditionRef, "@referredType": PolicyCondition }
    PolicyVariableRef:
      kind: ref
      properties:
        id: { type: string, required: true }
        href: { type: string, serverManaged: true }
        name: { type: string }
        "@type": { type: string }
        "@baseType": { type: string }
        "@schemaLocation": { type: string }
        "@referredType": { type: string }
      tmf: { "@type": PolicyVariableRef, "@referredType": PolicyVariable }
    PolicyActionRef:
      kind: ref
      properties:
        id: { type: string, required: true }
        href: { type: string, serverManaged: true }
        name: { type: string }
        "@type": { type: string }
        "@baseType": { type: string }
        "@schemaLocation": { type: string }
        "@referredType": { type: string }
      tmf: { "@type": PolicyActionRef, "@referredType": PolicyAction }
    PartyRevSharingPolicyConditionVariable:
      kind: entry
      properties:
        id: { type: string, serverManaged: true }
        href: { type: string, serverManaged: true }
        value: { type: string }
        policyCondition: { ref: PolicyConditionRef }
        policyConditionVariable: { ref: PolicyVariableRef }
        "@type": { type: string, requiredInFVO: true }
        "@baseType": { type: string }
        "@schemaLocation": { type: string }
      tmf: { "@type": PartyRevSharingPolicyConditionVariable }
    PartyRevSharingPolicyActionVariable:
      kind: entry
      properties:
        id: { type: string, serverManaged: true }
        href: { type: string, serverManaged: true }
        value: { type: string }
        policyAction: { ref: PolicyActionRef }
        policyActionVariable: { ref: PolicyVariableRef }
        "@type": { type: string, requiredInFVO: true }
        "@baseType": { type: string }
        "@schemaLocation": { type: string }
      tmf: { "@type": PartyRevSharingPolicyActionVariable }
    PartyRevSharingAlgorithm:
      kind: resource
      properties:
        id: { type: string, serverManaged: true }
        href: { type: string, serverManaged: true }
        name: { type: string, requiredInFVO: true }
        description: { type: string }
        createdDate: { type: date-time, serverManaged: true, extension: backend }
        lastUpdate: { type: date-time, serverManaged: true, extension: backend }
        policy: { array: PolicyRef, minItems: 1 }
        conditionVariable: { array: PartyRevSharingPolicyConditionVariable }
        actionVariable: { array: PartyRevSharingPolicyActionVariable }
        "@type": { type: string, requiredInFVO: true }
        "@baseType": { type: string }
        "@schemaLocation": { type: string }
      shapes:
        FVO: [name, description, policy, conditionVariable, actionVariable, "@type"]
        MVO: [name, description, policy, conditionVariable, actionVariable, "@type"]
      tmf: { "@type": PartyRevSharingAlgorithm }
      label: { one: algorithm, many: algorithms, entity: revenue sharing algorithm }
    Hub:
      kind: hub
      properties:
        id: { type: string, serverManaged: true }
        href: { type: string, serverManaged: true }
        callback: { type: string, format: uri, required: true }
        query: { type: string }
        "@type": { type: string }
      shapes: { FVO: [callback, query, "@type"] }
    Error:
      kind: error
      properties:
        code: { type: string, required: true }
        reason: { type: string, required: true }
        message: { type: string }
        status: { type: string }
        referenceError: { type: string }
        "@type": { type: string }
  pages:
    home:
      kind: overview
      summary:
        apiInfo:
          tmfNumber: "736"
          title: Revenue Sharing Algorithm Management
          version: "5.0.0"
          description: Revenue Sharing Algorithm Management API goal is to provide the Algorithm to calculate a revenue share.
          basePath: /tmf-api/revenueSharingAlgorithmManagement/v5
          authHeader: X-API-Key
        resources:
          - name: PartyRevSharingAlgorithm
            description: "Policy type of algorithm to calculate revenue share: a named set of policies plus the condition and action variables that parameterise it."
            route: /party-rev-sharing-algorithm
            pageLabel: Revenue Sharing Algorithms
            collectionPath: /partyRevSharingAlgorithm
            itemPath: "/partyRevSharingAlgorithm/{id}"
            requiredOnCreate: [name, "@type"]
            subResources:
              - { name: policy, kind: ref, minItems: 1 }
              - { name: conditionVariable, kind: entry }
              - { name: actionVariable, kind: entry }
        operations:
          - method: GET
            path: /partyRevSharingAlgorithm
            operationId: listPartyRevSharingAlgorithm
            summary: List or find PartyRevSharingAlgorithm objects
            success: ["200"]
          - method: POST
            path: /partyRevSharingAlgorithm
            operationId: createPartyRevSharingAlgorithm
            summary: Creates a PartyRevSharingAlgorithm
            success: ["201", "202"]
          - method: GET
            path: "/partyRevSharingAlgorithm/{id}"
            operationId: retrievePartyRevSharingAlgorithm
            summary: Retrieves a PartyRevSharingAlgorithm by ID
            success: ["200"]
          - method: PATCH
            path: "/partyRevSharingAlgorithm/{id}"
            operationId: patchPartyRevSharingAlgorithm
            summary: Updates partially a PartyRevSharingAlgorithm
            success: ["200", "202"]
          - method: DELETE
            path: "/partyRevSharingAlgorithm/{id}"
            operationId: deletePartyRevSharingAlgorithm
            summary: Deletes a PartyRevSharingAlgorithm
            success: ["202", "204"]
          - method: POST
            path: /hub
            operationId: createHub
            summary: Create a subscription (hub) to receive Events
            success: ["201"]
          - method: DELETE
            path: "/hub/{id}"
            operationId: hubDelete
            summary: Remove a subscription (hub) to receive Events
            success: ["204"]
          - method: GET
            path: /hub
            operationId: listHub
            summary: List event subscriptions (Event Hub page)
            success: ["200"]
            notInSpec: true
          - method: GET
            path: "/hub/{id}"
            operationId: retrieveHub
            summary: Retrieve an event subscription (hub record page)
            success: ["200"]
            notInSpec: true
        events:
          - name: partyRevSharingAlgorithmAttributeValueChangeEvent
            kind: Attribute value change
            listenerPath: /listener/partyRevSharingAlgorithmAttributeValueChangeEvent
          - name: partyRevSharingAlgorithmCreateEvent
            kind: Create
            listenerPath: /listener/partyRevSharingAlgorithmCreateEvent
          - name: partyRevSharingAlgorithmDeleteEvent
            kind: Delete
            listenerPath: /listener/partyRevSharingAlgorithmDeleteEvent
          - name: partyRevSharingAlgorithmStateChangeEvent
            kind: State change
            listenerPath: /listener/partyRevSharingAlgorithmStateChangeEvent
        primaryResourceNoun: Algorithms
        countService: partyRevSharingAlgorithmService
    partyRevSharingAlgorithm:
      kind: resource
      dir: party-rev-sharing-algorithm
      component: PartyRevSharingAlgorithmPage
      comment: "TMF736 PartyRevSharingAlgorithm: list, create dialog and record page, from config.ts."
      expose: { key: ./PartyRevSharingAlgorithm, file: PartyRevSharingAlgorithm, pageName: PartyRevSharingAlgorithm }
      service: partyRevSharingAlgorithmService
      lookups: true
      config:
        list:
          breadcrumb: [Revenue Sharing Algorithm]
          title: Party Revenue Sharing Algorithms
          subtitle: TMF736 Revenue Sharing Algorithm Management
          card:
            title: Algorithms
            description: Named policy sets plus condition/action variables that decide how revenue is split between parties.
            noun: [algorithm, algorithms]
            minTableWidth: 1000
            buttonActionVariant: menu
            rowLabel: name
            searchPlaceholder: Search algorithms by name
            searchParam: name
            emptyTitle: No revenue sharing algorithms yet
            emptyBody: Create the first one with “New Algorithm”.
            primaryAction: { label: New Algorithm, icon: { icon: Plus, size: 16 } }
            refresh: true
            rowClick: open-detail
          rowFrom:
            id: { path: id }
            name: { path: name }
            description: { path: description }
            policyCount: { count: policy }
            lastUpdate: { path: lastUpdate }
          columns:
            - { key: id, label: ID, width: 170, sortable: true, render: id-link }
            - { key: name, label: Name, width: 200, sortable: true, render: primary }
            - { key: description, label: Description, sortable: true, render: ellipsis }
            - key: policyCount
              label: Policies
              width: 120
              render: count-badge
              badge: { icon: ScrollText, one: policy, many: policies }
            - { key: lastUpdate, label: Last Update, width: 190, sortable: true, render: datetime-stack }
          sortOptions:
            - { key: name, label: Name }
            - { key: description, label: Description }
            - { key: lastUpdate, label: Last Update }
            - { key: id, label: ID }
          filterFields:
            - { key: id, label: ID, type: text }
            - { key: name, label: Name, type: text }
            - { key: description, label: Description, type: text }
            - { key: policy, label: Policies, type: text, list: policy, param: name, placeholder: Policy name }
            - { key: lastUpdate, label: Last Update, type: date }
          rowActions:
            - key: view
              label: View details
              ariaLabel: "View {name}"
              icon: { icon: Eye, size: 16 }
              tone: brand
              action: open-detail
            - key: edit
              label: Edit
              ariaLabel: "Edit {name}"
              icon: { icon: Pencil, size: 16 }
              tone: neutral
              action: open-edit
            - key: delete
              label: Delete
              ariaLabel: "Delete {name}"
              icon: { icon: Trash2, size: 16 }
              tone: danger
              action: confirm-delete
          mobileCard:
            id: id
            title: name
            badge: policyCount
            subtitle: { path: description }
            meta: { format: "Updated {0}", args: [{ dateTime: lastUpdate, empty: "—" }] }
          delete:
            title: Delete revenue sharing algorithm?
            strong: name
            text: will be permanently removed. This action cannot be undone.
            confirmLabel: Delete
            toast: Deleted successfully
        form:
          formId: create-party-rev-sharing-algorithm-form
          width: wide
          title: Create revenue sharing algorithm
          description: "A named policy set, plus the condition and action variables that decide how revenue is split. References are picked from their catalogues; ids and links are set by the server."
          submitLabel: Create algorithm
          validateOn: submit
          fields:
            - kind: text
              name: name
              label: Name
              ariaLabel: Name
              placeholder: e.g. Standard 70/30 Split
              required: { message: Enter a name. }
            - kind: textarea
              name: description
              label: Description
              placeholder: What this algorithm is for and when it applies
              autoResize: true
              minRows: 2
              maxRows: 6
            - kind: repeatable
              name: policies
              section: { title: Policies, required: true, hint: "At least one, from the policy catalogue" }
              initialItems: 1
              minItems: { path: policy.id, message: Select at least one policy. }
              item:
                title: "Policy {n}"
                removeLabel: "Remove policy {n}"
                canRemove: more-than-one
                fields:
                  - kind: ref
                    name: policy
                    lookup: policy
                    label: Policy
                    placeholder: Select a policy
                    required: { message: Select a policy. }
                    groupRuleOnFirst: true
              addLabel: Add policy
            - kind: repeatable
              name: conditionVariables
              section: { title: Condition variables, hint: When — optional }
              initialItems: 0
              emptyText: No condition variables — the rule applies unconditionally.
              item:
                title: "Condition variable {n}"
                removeLabel: "Remove condition variable {n}"
                canRemove: always
                grid: 3
                fields:
                  - kind: ref
                    name: policyCondition
                    lookup: policyCondition
                    label: Policy condition
                    placeholder: Select a condition
                    required: { message: Select a policy condition. }
                  - kind: ref
                    name: policyConditionVariable
                    lookup: policyVariable
                    label: Variable
                    placeholder: Select a variable
                    required: { message: Select a variable. }
                  - kind: value
                    name: value
                    ariaLabel: "Condition variable {n} value"
                    placeholder: e.g. 300
                    required: { message: Enter a value. }
              addLabel: Add condition variable
            - kind: repeatable
              name: actionVariables
              section: { title: Action variables, hint: Then — optional }
              initialItems: 0
              emptyText: No action variables.
              item:
                title: "Action variable {n}"
                removeLabel: "Remove action variable {n}"
                canRemove: always
                grid: 3
                fields:
                  - kind: ref
                    name: policyAction
                    lookup: policyAction
                    label: Policy action
                    placeholder: Select an action
                    required: { message: Select a policy action. }
                  - kind: ref
                    name: policyActionVariable
                    lookup: policyVariable
                    label: Variable
                    placeholder: Select a variable
                    required: { message: Select a variable. }
                  - kind: value
                    name: value
                    ariaLabel: "Action variable {n} value"
                    placeholder: e.g. 30
                    required: { message: Enter a value. }
              addLabel: Add action variable
          guard:
            - { required: name, message: Name is required }
            - { anyItem: policies, path: policy.id, message: At least one policy with an ID is required }
          payload:
            "@type": { const: PartyRevSharingAlgorithm }
            name: { from: name }
            description: { from: description, omitEmpty: true }
            policy:
              array: policies
              keepWhen: [policy.id]
              each: { lovRef: policy, type: PolicyRef, referredType: Policy }
            conditionVariable:
              array: conditionVariables
              keepWhen: [value, policyCondition.id, policyConditionVariable.id]
              omitEmpty: true
              item:
                "@type": { const: PartyRevSharingPolicyConditionVariable }
                value: { from: value, omitEmpty: true }
                policyCondition: { lovRef: policyCondition, type: PolicyConditionRef, referredType: PolicyCondition }
                policyConditionVariable:
                  lovRef: policyConditionVariable
                  type: PolicyVariableRef
                  referredType: PolicyVariable
            actionVariable:
              array: actionVariables
              keepWhen: [value, policyAction.id, policyActionVariable.id]
              omitEmpty: true
              item:
                "@type": { const: PartyRevSharingPolicyActionVariable }
                value: { from: value, omitEmpty: true }
                policyAction: { lovRef: policyAction, type: PolicyActionRef, referredType: PolicyAction }
                policyActionVariable:
                  lovRef: policyActionVariable
                  type: PolicyVariableRef
                  referredType: PolicyVariable
          toast: Revenue sharing algorithm created successfully
          edit:                                   # same dialog, PATCH; only when the API has update + _MVO
            formId: edit-party-rev-sharing-algorithm-form
            title: "Edit {name}"
            description: Fields follow PartyRevSharingAlgorithm_MVO. Only the attributes you change are sent; ids and links stay as they are.
            submitLabel: Save changes
            fields: [name, description, policies, conditionVariables, actionVariables]
            payload: [name, description, policy, conditionVariable, actionVariable]
            toast: Revenue sharing algorithm updated successfully
            noChanges: No changes to save.
        detail:
          idPrefix: algorithm
          tabsAriaLabel: Record sections
          breadcrumbRoot: Revenue Sharing Algorithm
          header: { title: name, recordId: id, description: description }
          loadingText: Loading revenue sharing algorithm…
          notFound:
            title: Algorithm not found
            alertTitle: Revenue sharing algorithm not found
            alertDescription: "No algorithm with id {id} could be loaded."
          tabs:
            - { key: overview, label: Overview, icon: { icon: FileText, size: 15 } }
            - { key: policies, label: Policies, icon: { icon: ScrollText, size: 15 }, count: policy }
            - key: conditions
              label: Condition Variables
              icon: { icon: GitBranch, size: 15 }
              count: conditionVariable
            - key: actions
              label: Action Variables
              icon: { icon: SlidersHorizontal, size: 15 }
              count: actionVariable
          overview:
            stats:
              label: Algorithm summary
              items:
                - key: policies
                  label: Policies
                  icon: { icon: ScrollText, size: 14 }
                  value: { count: policy }
                  hint: { join: policy, pick: [name, id], sep: ", ", empty: None referenced }
                  goTo: policies
                  ariaLabel:
                    format: "{0} — open the Policies tab"
                    args: [{ plural: { count: policy }, one: policy, many: policies }]
                - key: conditions
                  label: Condition variables
                  icon: { icon: GitBranch, size: 14 }
                  value: { count: conditionVariable }
                  hint: { ifAny: conditionVariable, then: When these hold, else: No conditions }
                  goTo: conditions
                  ariaLabel:
                    format: "{0} — open the tab"
                    args: [{ plural: { count: conditionVariable }, one: condition variable, many: condition variables }]
                - key: actions
                  label: Action variables
                  icon: { icon: SlidersHorizontal, size: 14 }
                  value: { count: actionVariable }
                  hint: { ifAny: actionVariable, then: Then these apply, else: No actions }
                  goTo: actions
                  ariaLabel:
                    format: "{0} — open the tab"
                    args: [{ plural: { count: actionVariable }, one: action variable, many: action variables }]
                - key: updated
                  label: Last update
                  icon: { icon: Clock3, size: 14 }
                  value: { relativeTime: lastUpdate, empty: "—" }
                  hint: { dateTime: lastUpdate, empty: Not provided }
            main:
              - block: rule-flow
                title: Sharing rule
                count: { plural: { sumCount: [conditionVariable, actionVariable] }, one: variable, many: variables }
                viewAll: { label: View all variables, goTo: conditions }
                when:
                  label: When
                  icon: { icon: GitBranch, size: 15 }
                  source: conditionVariable
                  emptyText: No condition variables — the rule applies unconditionally.
                  title: { pick: [policyCondition.name, policyCondition.id], empty: "Condition {n}" }
                  variable: { pick: [policyConditionVariable.name, policyConditionVariable.id] }
                  value: value
                  ids:
                    - { label: condition, path: policyCondition.id }
                    - { label: variable, path: policyConditionVariable.id }
                then:
                  label: Then
                  icon: { icon: SlidersHorizontal, size: 15 }
                  source: actionVariable
                  emptyText: No action variables.
                  title: { pick: [policyAction.name, policyAction.id], empty: "Action {n}" }
                  variable: { pick: [policyActionVariable.name, policyActionVariable.id] }
                  value: value
                  ids: [{ label: action, path: policyAction.id }, { label: variable, path: policyActionVariable.id }]
              - block: entity-rows
                title: Policies
                source: policy
                viewAll: { label: View all policies, goTo: policies }
                emptyText: No policies.
                icon: { icon: ScrollText, size: 16 }
                itemTitle: { pick: [name, id] }
                subtitle:
                  parts:
                    - { expr: { path: version }, format: "Version {0}" }
                    - { expr: { pick: ["@referredType", "@type"] } }
                  sep: " · "
                meta: id
            aside:
              - block: timeline
                title: Timeline
                items:
                  - { key: updated, path: lastUpdate, icon: { icon: History, size: 14 }, title: Last updated }
                  - { key: created, path: createdDate, icon: { icon: CalendarPlus, size: 14 }, title: Created }
              - block: key-value
                title: Record
                items:
                  - { label: ID, path: id, mono: true }
                  - { label: Type, path: "@type", mono: true }
                  - { label: Base type, path: "@baseType", mono: true }
                  - { label: Schema, path: "@schemaLocation", mono: true }
                  - { label: API href, path: href, mono: true, link: true }
          collections:
            - tab: policies
              source: policy
              title: Policies
              count: { one: policy, many: policies }
              search: { label: Search policies, placeholder: Search policies }
              defaultView: card
              card:
                icon: { icon: ScrollText, size: 18 }
                title: { pick: [name, id] }
                subtitle: { pick: ["@referredType"], empty: Policy }
                fields:
                  - { label: ID, value: { path: id }, mono: true }
                  - { label: Version, value: { path: version }, mono: true }
                  - { label: Type, value: { path: "@type" }, mono: true }
                  - { label: Base type, value: { path: "@baseType" }, mono: true }
                  - { label: Schema, value: { path: "@schemaLocation" }, mono: true }
                  - { label: Href, value: { path: href }, mono: true }
              columns:
                - { key: name, label: Name, render: primary, value: { pick: [name, id] } }
                - { key: id, label: ID, width: 200, render: mono-muted }
                - { key: version, label: Version, width: 110, render: mono-plain, empty: em-dash }
            - tab: conditions
              source: conditionVariable
              title: Condition variables
              count: { one: variable, many: variables }
              search: { label: Search condition variables, placeholder: Search variables }
              defaultView: table
              card:
                icon: { icon: GitBranch, size: 18 }
                title: { pick: [policyCondition.name, policyCondition.id], empty: "Condition variable {n}" }
                subtitle: { text: Policy condition }
                fields:
                  - { label: Value, value: { path: value } }
                  - { label: Entry ID, value: { path: id }, mono: true }
                  - { label: Entry type, value: { path: "@type" }, mono: true }
                  - { refOf: policyCondition, role: Condition }
                  - { label: Variable, value: { path: policyConditionVariable.name } }
                  - { refOf: policyConditionVariable, role: Variable }
                  - { label: Entry href, value: { path: href }, mono: true }
                  - { label: Base type, value: { path: "@baseType" }, mono: true }
                  - { label: Schema, value: { path: "@schemaLocation" }, mono: true }
              columns:
                - { key: value, label: Value, width: 140, render: primary-plain, empty: em-dash }
                - { key: policyCondition, label: Policy Condition, render: ref-stack }
                - { key: policyConditionVariable, label: Condition Variable, render: ref-stack }
            - tab: actions
              source: actionVariable
              title: Action variables
              count: { one: variable, many: variables }
              search: { label: Search action variables, placeholder: Search variables }
              defaultView: table
              card:
                icon: { icon: SlidersHorizontal, size: 18 }
