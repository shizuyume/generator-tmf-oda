        note: "Block overview: stat strip, rule flow (When/Then), entity rows, timeline."
        rules:
          - select: ".dt-overview-stack"
            note: "Overview blocks (OverviewBlocks.tsx) — design: shipment detail Overview, on neudela tokens. stat strip on top, then the two-column overview"
