# =====================================================================================
# NEUDELA FE TEMPLATE — source of truth frontend (neudela-fe/v1)
# -------------------------------------------------------------------------------------
# Satu file ini merepresentasikan kondisi template FE neudela-lab saat ini
# (design-lab/neudela-lab, neudela@0.2.0, redesign "Neudela Logistics Dashboard").
# Generator FE membaca file ini dan harus menghasilkan aplikasi yang sama persis
# dengan template: layout, ukuran, warna, tema light/dark, perilaku, copy,
# serta request/response API.
#
# Dua lapis:
#   template:  bagian TETAP. Sama untuk setiap aplikasi yang dibangkitkan:
#              stack, tema, shell, komponen (list/detail/form/dialog/toast),
#              API client, style.
#   app:       bagian PER-APLIKASI. Diisi per domain (TMF ODA atau non-TMF):
#              brand, navigasi, schema, operasi (request/response), lookup (LOV), halaman.
#              Contoh lengkap di bawah = TMF736 Revenue Sharing Algorithm Management.
# Untuk domain lain (TMF lain atau non-TMF), ganti seluruh blok `app` dan biarkan
# `template` apa adanya.
#
# Konvensi nilai (berlaku di seluruh file):
#   - Nilai style = CSS literal, di-emit verbatim (mis. "var(--color-bg-surface)", "1px solid var(--color-border)").
#   - {{path.ke.nilai}}  = substitusi saat GENERATE, path absolut dari root file ini
#                           (mis. {{template.layout.shell.topbar.height}}, {{app.meta.name}}).
#   - {nama}             = interpolasi saat RUNTIME dari data/state (mis. "Delete {name}", "{n}.").
#                           {n} = nomor urut 1-based; {count}/{total} = angka; {q} = kata kunci search.
#   - Path data          = dot-path relatif ke objek yang sedang dirender (mis. policyCondition.name).
#                           pick: [a, b] = ambil nilai non-kosong pertama; fallback = teks bila semua kosong.
#   - Ikon               = nama export lucide-react (mis. Plus, Trash2), size dalam px.
#   - Urutan list/map    = urutan render/emit. Generator TIDAK boleh mengurutkan ulang.
# =====================================================================================

apiVersion: neudela-fe/v1
kind: FrontendTemplate

meta:
  name: neudela-fe-template
  version: 1.0.0
  status: baseline            # baseline = cermin 1:1 dari neudela-lab, sudah diverifikasi
  lang: id                    # bahasa komentar file ini; copy UI = en (lihat app.meta.uiLang)
  derivedFrom:
    project: design-lab/neudela-lab
    design: "Claude Design — Neudela design system files › Neudela Logistics Dashboard.dc.html"
    designSystem: neudela@0.2.0
  description: >-
    Template FE neudela: shell sidebar + topbar, list card (toolbar, advanced filter, chips,
    tabel dengan nomor baris dan menu aksi ⋯, pagination), halaman detail (header, tab,
    overview kaya, tab per array), form dialog (FVO, relasi dari LOV), dialog konfirmasi,
    toast, dan dark mode serentak.

# -------------------------------------------------------------------------------------
# GENERATION — aturan agar hasilnya pasti (deterministik)
# -------------------------------------------------------------------------------------
generation:
  deterministic: true
  rules:
    - Input YAML yang sama → output byte-identik. Tidak ada timestamp, random id, atau urutan hash.
    - Semua list dan map di-emit sesuai urutan di file ini.
    - Tidak ada nilai default implisit. Setiap nilai yang mempengaruhi tampilan tertulis di file ini.
    - "Teks UI diambil verbatim dari file ini (tanda kutip “ ”, em dash —, elipsis … dipertahankan)."
    - "Style di-emit dari template.styles; token warna/ukuran dari template.theme. Tidak ada CSS lain."
  codeStyle:
    indent: 2 spaces
    quotes: single
    semicolons: true
    lineEndings: LF
    trailingNewline: true
    importExtensions: none       # import relatif tanpa ekstensi ('./App', '../../service')
  output:
    # File TETAP: disalin verbatim dari generator/templates/fe-neudela/files (= salinan file lab ini;
    # dijaga sama oleh generator/tools/neudela-yaml-sync.mjs). Tidak berisi nama domain apa pun.
    fixed:
      - mock/mockApi.ts
      - public/favicon.svg
      - src/App.css
      - src/App.tsx
      - src/bootstrap.tsx
      - src/components/Toast.tsx
      - src/components/detail/CopyButton.tsx
      - src/components/detail/Detail.css
      - src/components/detail/DetailCard.tsx
      - src/components/detail/DetailHeader.tsx
      - src/components/detail/DetailTable.tsx
      - src/components/detail/DetailTabs.tsx
      - src/components/detail/Overview.css
      - src/components/detail/OverviewBlocks.tsx
      - src/components/detail/ViewToggle.tsx
      - src/components/form/Form.css
      - src/components/form/FormDialog.tsx
      - src/components/form/LookupPicker.tsx
      - src/components/list-table/ListTable.css
      - src/components/list-table/ListTable.tsx
      - src/components/list-table/ListTableFilterChips.tsx
      - src/components/list-table/ListTableFilterPanel.tsx
      - src/components/list-table/ListTableMobileList.tsx
      - src/components/list-table/ListTablePageSize.tsx
      - src/components/list-table/ListTablePagination.tsx
      - src/components/list-table/ListTableRowMenu.tsx
      - src/components/list-table/ListTableToolbar.tsx
      - src/components/list-table/filters.ts
      - src/components/list-table/format.ts
      - src/components/list-table/types.ts
      - src/federation/createProtectedPage.tsx
      - src/hooks/useDebouncedValue.ts
      - src/hooks/useMediaQuery.ts
      - src/index.css
      - src/index.tsx
      - src/pages/overview/index.tsx
      - src/pages/overview/summary.ts
      - src/resource/ResourceDetailPage.tsx
      - src/resource/ResourceFormDialog.tsx
      - src/resource/ResourceListPage.tsx
      - src/resource/ResourcePage.tsx
      - src/resource/expr.ts
      - src/resource/payload.ts
      - src/resource/render.tsx
      - src/resource/types.ts
      - src/resource/useLookups.ts
      - src/service/api.ts
      - src/service/index.ts
      - src/service/lookupService.ts
      - src/service/resource.ts
      - src/vite-env.d.ts
      - tsconfig.json
      - tsconfig.node.json
    # File PER-APP: dibangkitkan dari blok `app` oleh generator/src/fe/neudela/emitApp.mjs.
    perApp:
      - package.json                         # meta + template.stack
      - index.html                           # title, description, font, script tema pra-paint
      - vite.config.ts                       # port, proxy target, plugin mock
      - .env.example                         # app.environment.variables
      - .env.mock                            # app.environment.mock
      - .gitignore                           # template.stack.gitignore
      - src/app/env.ts                       # TMF_BASE = app.api.basePath
      - src/app/services.ts                  # app.services
      - src/app/lookups.ts                   # app.lookups (LOV ke API pemilik entity)
      - src/app/icons.ts                     # ikon lucide yang dipakai config halaman
      - src/app/shell.tsx                    # app.brand + app.navigation
      - src/app/summary.ts                   # app.pages.home.summary (Overview)
      - src/app/theme.css                    # override token/layout (kosong = palet neudela + layout template)
      - src/pages/{dir}/config.ts            # app.pages.<key>.config (ResourceConfig)
      - src/pages/{dir}/index.tsx            # <ResourcePage config />
      - src/exposes/{expose.file}.tsx        # seam MFE (createProtectedPage)
      - src/types/{meta.typesFile}.ts        # app.schemas
      - src/types/index.ts
      - mock/seed.ts                         # app.mock
    # Hanya di lab (tidak dibangkitkan): README.md, neudela-fe-template.yaml, e2e/, package-lock.json.

# -------------------------------------------------------------------------------------
# TEMPLATE — bagian tetap
# -------------------------------------------------------------------------------------
template:

  # ── Stack ─────────────────────────────────────────────────────────────────────────
  stack:
    bundler: vite
    framework: react
    language: typescript
    dependencies:
      lucide-react: "^1.49.0"
      neudela: "0.2.0"              # pin persis; token & primitive berasal dari versi ini
      react: "19.2.5"
      react-dom: "19.2.5"
      react-hook-form: "^7.89.0"
      react-router-dom: "^6.30.6"
    devDependencies:
      "@module-federation/vite": "^1.23.0"
      "@types/node": "^22.19.0"
      "@types/react": "^19.2.14"
      "@types/react-dom": "^19.2.3"
      "@vitejs/plugin-react": "^6.1.1"
      typescript: "~6.0.3"
      vite: "^8.3.1"
    packageJson:
      private: true
      type: module
      scripts:
        dev: vite
        dev:mock: vite --mode mock
        typecheck: tsc -p tsconfig.json && tsc -p tsconfig.node.json
        build: npm run typecheck && vite build
        preview: vite preview
    tsconfig:
      target: ES2022
      lib: [ES2022, DOM, DOM.Iterable]
      module: ESNext
      moduleResolution: bundler
      jsx: react-jsx
      types: [vite/client]
      strict: true
      noUnusedLocals: true
      noUnusedParameters: true
      noFallthroughCasesInSwitch: true
      forceConsistentCasingInFileNames: true
      isolatedModules: true
      resolveJsonModule: true
      skipLibCheck: true
      noEmit: true
      include: [src]
    gitignore: [node_modules, dist, .vscode, "*.local", e2e/screenshots]

  # ── Module Federation (vite.config.ts) ──────────────────────────────────────────────
  federation:
    plugin: "@module-federation/vite"
    role: remote                     # app tetap jalan sendiri; host lain memuat halamannya
    name: "{app.meta.name} → identifier (non-alfanumerik → _), mis. neudela-lab → neudela_lab"
    filename: remoteEntry.js
    manifest: true                   # mf-manifest.json (nama, exposes, shared) — dipakai host & e2e/mfe-host.mjs
    exposes: "setiap app.pages[*].expose (urutan navigasi): '{expose.key}' → ./src/exposes/{expose.file}.tsx"
    shared: [react, react-dom, neudela]   # singleton; requiredVersion = template.stack.dependencies
    buildTarget: esnext              # runtime federation memakai top-level await
    cors: true                       # dev + preview: host di origin lain memuat remoteEntry + chunk
    styles: "createProtectedPage mengimpor neudela/style.css, index.css, App.css → halaman yang di-mount host membawa gayanya; token :root/.dark-theme bersifat global (host diharapkan memakai neudela)"
    proof: "e2e/mfe-host.mjs: host Vite terpisah (e2e/mfe-host, shell sendiri) membaca mf-manifest.json, me-mount setiap expose, cek shared singleton, list + dialog + record page"

  # ── Output / mode aplikasi ────────────────────────────────────────────────────────
  output:
    mode: full-app                  # satu aplikasi utuh dengan shell sendiri, SEKALIGUS remote Module Federation
    mfeReady: true                  # seam MFE (async bootstrap, src/exposes, createProtectedPage) + plugin terpasang (template.federation)
    bootstrap:
      entry: src/index.tsx          # isinya hanya: import('./bootstrap'); export {};
      bootstrap: src/bootstrap.tsx  # createRoot(#root).render(<React.StrictMode><App/></React.StrictMode>)
      cssOrder: [neudela/style.css, ./index.css]   # neudela dulu agar index.css/App.css bisa override
    indexHtml:                       # index.html (per-app: title, description, storage key)
      lang: en
      head:
        - '<meta charset="utf-8" />'
        - '<meta name="viewport" content="width=device-width, initial-scale=1" />'
        - '<meta name="description" content="{{app.meta.description}}" />'
        - '<link rel="icon" type="{{app.meta.favicon.type}}" href="{{app.meta.favicon.href}}" />'
        - '<link rel="preconnect" href="https://fonts.googleapis.com" />'
        - '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />'
        - '<link href="{{template.theme.fonts.stylesheet}}" rel="stylesheet" />'
        - '<title>{{app.meta.title}}</title>'
        - "<script> theme pre-paint: baca localStorage[{{template.theme.darkMode.storage.key}}] ('dark' | 'light'), fallback prefers-color-scheme: dark → document.documentElement.classList.add('dark-theme') </script>"
      body:
        - '<noscript>You need to enable JavaScript to run this app.</noscript>'
        - '<div id="root"></div>'
        - '<script type="module" src="/src/index.tsx"></script>'
    exposes:
      wrapper: createProtectedPage   # React.lazy + Suspense + ErrorBoundary per halaman
      suspenseFallback:
        className: lab-page lab-muted
        text: "Loading {pageName}…"
      errorFallback:
        container: lab-page
        component: NeuronAlert
        props: { variant: danger }
        title: "Failed to load {pageName}"
        description: "{error.message}"
        actions: [{ label: Retry, onClick: reset-boundary }]
    router:
      library: react-router-dom
      component: BrowserRouter
      future: { v7_startTransition: true, v7_relativeSplatPath: true }
      unknownPath: { redirectTo: "/", replace: true }
      remountOnNavKey: true          # <Page key={location.key}>: klik ulang nav = kembali ke list
    devServer:
      port: 4010
      strictPort: true
      previewPort: 4010
      proxy:                         # mode default (npm run dev)
        path: /tmf-api
        target: "env.API_PROXY_TARGET || {{app.environment.apiProxyTargetDefault}}"
        changeOrigin: true
      mockMode:                      # npm run dev:mock → plugin mockApi(MOCK) (mock/mockApi.ts + mock/seed.ts), tanpa proxy
        serves: ["{{app.api.basePath}}", "{{app.environment.lookupMockBase}}"]

  # ── Tema ──────────────────────────────────────────────────────────────────────────
  # Token di bawah adalah nilai neudela@0.2.0 (dist/style.css: :root dan .dark-theme).
  # emit: diff-against-package → generator hanya meng-emit override untuk token yang
  # nilainya berbeda dari paket. Template ini tidak mengubah satu token pun, jadi
  # override = kosong. Untuk rebrand, ubah nilai di sini dan generator akan meng-emit
  # :root { ... } dan .dark-theme { ... } yang berbeda saja.
  theme:
    emit: diff-against-package
    package: neudela@0.2.0
    darkClass: dark-theme
    darkMode:
      applyTo: [html, body]          # <html>: color-scheme + scrollbar root; <body>: modal/portal
      default: system                # localStorage → prefers-color-scheme
      storage:
        key: "{{app.meta.name}}:theme"   # TMF736: neudela-lab:theme
        values: { dark: dark, light: light }
      prePaintScript: true           # script inline di <head> index.html: pasang .dark-theme di <html> sebelum React (tanpa kedip terang)
      apply: useLayoutEffect         # sebelum paint; html + body di-toggle bersamaan
      switch:
        disableTransitionsClass: theme-switching   # dipasang di <html>, paksa reflow, dilepas setelah 2× requestAnimationFrame
        crossfade:
          api: document.startViewTransition       # dengan flushSync(setDarkMode) di dalam callback
          duration: 220ms
          easing: ease
          skipWhen: [unsupported, "prefers-reduced-motion: reduce"]
      toggle:
        component: NeuronToggle
        props: { size: sm }
        label: Dark mode
        position: topbar-right
    fonts:
      sans:
        token: --font-family
        stack: "\"Inter\", system-ui, -apple-system, sans-serif"   # dari neudela
        load: { family: Inter, weights: [400, 500, 600, 700] }
      mono:
        token: --lab-font-mono       # token milik template (neudela tidak punya token mono)
        stack: "'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
        load: { family: JetBrains Mono, weights: [400, 500] }
      stylesheet: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      preconnect: ["https://fonts.googleapis.com", "https://fonts.gstatic.com (crossorigin)"]
    palette:                         # skala warna neudela (referensi untuk token semantik)
      brand:   { 25: "#fffcf7", 50: "#fdf7ed", 100: "#f8ebcd", 200: "#f1ce96", 300: "#eab05f", 400: "#e5963a", 500: "#df7e30", 600: "#c3571c", 700: "#a23c1b", 800: "#84301c", 900: "#6d291a", 950: "#3e130a" }
      slate:   { 25: "#fcfcfd", 50: "#f9fafb", 100: "#f2f4f7", 200: "#e4e7ec", 300: "#d0d5dd", 400: "#98a2b3", 500: "#667085", 600: "#475467", 700: "#344054", 800: "#182230", 900: "#101828", 950: "#0c111d" }
      gray:    { 25: "#fafafa", 50: "#f5f5f6", 100: "#f0f1f1", 200: "#ececed", 300: "#cecfd2", 400: "#94969c", 500: "#85888e", 600: "#61646c", 700: "#333741", 800: "#1f242f", 900: "#161b26", 950: "#0c111d" }
      emerald: { 50: "#ecfdf5", 100: "#d1fae5", 200: "#a7f3d0", 300: "#6ee7b7", 400: "#34d399", 500: "#10b981", 600: "#059669", 700: "#047857", 800: "#065f46", 900: "#064e3b", 950: "#022c22" }
      amber:   { 50: "#fffbeb", 100: "#fef3c7", 200: "#fde68a", 300: "#fcd34d", 400: "#fbbf24", 500: "#f59e0b", 600: "#d97706", 700: "#b45309", 800: "#92400e", 900: "#78350f", 950: "#451a03" }
      red:     { 50: "#fef2f2", 100: "#fee2e2", 200: "#fecaca", 300: "#fca5a5", 400: "#f87171", 500: "#ef4444", 600: "#dc2626", 700: "#b91c1c", 800: "#991b1b", 900: "#7f1d1d", 950: "#450a0a" }
      sky:     { 50: "#f0f9ff", 100: "#e0f2fe", 200: "#bae6fd", 300: "#7dd3fc", 400: "#38bdf8", 500: "#0ea5e9", 600: "#0284c7", 700: "#0369a1", 800: "#075985", 900: "#0c4a6e", 950: "#082f49" }
      blue:    { 50: "#eff6ff", 100: "#dbeafe", 200: "#bfdbfe", 300: "#93c5fd", 400: "#60a5fa", 500: "#3b82f6", 600: "#2563eb", 700: "#1d4ed8", 800: "#1e40af", 900: "#1e3a8a", 950: "#172554" }
      purple:  { 50: "#f9f5ff", 100: "#f4ebff", 200: "#e9d7fe", 300: "#d6bbfb", 400: "#b692f6", 500: "#9e77ed", 600: "#7f56d9", 700: "#6941c6", 800: "#53389e", 900: "#42307d", 950: "#2c1c5f" }
      pink:    { 50: "#fdf2fa", 100: "#fce7f6", 200: "#fbcfe8", 300: "#f472b6", 400: "#ec4899", 500: "#db2777", 600: "#be185d", 700: "#9d174d", 800: "#831843", 900: "#500724", 950: "#380419" }
      orange:  { 50: "#fffaf5", 100: "#ffeedb", 200: "#fed7aa", 300: "#fb923c", 400: "#f97316", 500: "#ea580c", 600: "#c2410c", 700: "#9a3412", 800: "#7c2d12", 900: "#431407", 950: "#270b04" }
    # Token semantik: [light (:root), dark (.dark-theme)]. Inilah "theme color" yang dipakai style.
    colors:
      --color-primary:             ["var(--brand-500)", "var(--brand-400)"]
      --color-primary-hover:       ["var(--brand-600)", "var(--brand-300)"]
      --color-primary-active:      ["var(--brand-700)", "var(--brand-200)"]
      --color-primary-light:       ["var(--brand-50)",  "#e5963a26"]
      --color-primary-border:      ["var(--brand-200)", "var(--brand-800)"]
      --color-success:             ["var(--emerald-600)", "var(--emerald-500)"]
      --color-success-hover:       ["var(--emerald-700)", "var(--emerald-400)"]
      --color-success-light:       ["var(--emerald-50)",  "#10b98126"]
      --color-success-border:      ["var(--emerald-200)", "var(--emerald-800)"]
      --color-warning:             ["var(--amber-600)", "var(--amber-500)"]
      --color-warning-hover:       ["var(--amber-700)", "var(--amber-400)"]
      --color-warning-light:       ["var(--amber-50)",  "#f59e0b26"]
      --color-warning-border:      ["var(--amber-200)", "var(--amber-800)"]
      --color-danger:              ["var(--red-600)", "var(--red-500)"]
      --color-danger-hover:        ["var(--red-700)", "var(--red-400)"]
      --color-danger-light:        ["var(--red-50)",  "#ef444426"]
      --color-danger-border:       ["var(--red-200)", "var(--red-800)"]
      --color-info:                ["var(--sky-600)", "var(--sky-500)"]
      --color-info-hover:          ["var(--sky-700)", "var(--sky-400)"]
      --color-info-light:          ["var(--sky-50)",  "#0ea5e926"]
      --color-info-border:         ["var(--sky-200)", "var(--sky-800)"]
      --color-bg:                  ["#fff", "var(--slate-950)"]
      --color-bg-canvas:           ["var(--slate-50)", "var(--slate-950)"]
      --color-bg-subtle:           ["var(--slate-50)", "var(--slate-800)"]
      --color-bg-surface:          ["#fff", "var(--slate-900)"]
      --color-bg-surface-hover:    ["var(--slate-50)", "var(--slate-800)"]
      --color-bg-sidebar:          ["#fff", "var(--slate-900)"]
      --color-border:              ["var(--slate-300)", "var(--slate-800)"]
      --color-border-hover:        ["var(--slate-400)", "var(--slate-700)"]
      --color-text-primary:        ["var(--slate-700)", "var(--slate-50)"]
      --color-text-secondary:      ["var(--slate-500)", "var(--slate-400)"]
      --color-text-tertiary:       ["var(--slate-400)", "var(--slate-500)"]
      --color-text-on-primary:     ["#fff", "var(--slate-950)"]
      --color-nav-active-bg:       ["var(--brand-50)", "#df7e3026"]
      --color-nav-active-text:     ["var(--brand-700)", "var(--brand-300)"]
      --color-nav-active-border:   ["var(--brand-500)", "var(--brand-400)"]
      --color-hero-bg:             ["#f4f5f8", "#13192f"]
    colorScheme: { light: light, dark: dark }      # :root / :root.dark-theme (form control, scrollbar, canvas)
    typography:
      weights: { regular: 400, medium: 500, semibold: 600, bold: 700 }
      # [font-size, line-height]
      scale:
        display-2xl: ["4.5rem", "5.625rem"]
        display-xl:  ["3.75rem", "4.5rem"]
        display-lg:  ["3rem", "3.75rem"]
        display-md:  ["2.25rem", "2.75rem"]
        display-sm:  ["1.875rem", "2.375rem"]
        display-xs:  ["1.5rem", "2rem"]
        text-xl:     ["1.25rem", "1.875rem"]
        text-lg:     ["1.125rem", "1.75rem"]
        text-md:     ["1rem", "1.5rem"]
        text-sm:     [".875rem", "1.25rem"]
        text-xs:     [".75rem", "1.125rem"]
      tokens: { size: "--fs-{name}", lineHeight: "--lh-{name}", weight: "--font-weight-{name}" }
      numerals: tabular-nums         # dipakai untuk semua angka (count, pagination, tanggal, nilai)
    spacing: { 1: ".25rem", 2: ".5rem", 3: ".75rem", 4: "1rem", 5: "1.25rem", 6: "1.5rem", 8: "2rem", 10: "2.5rem", 12: "3rem", 16: "4rem", 20: "5rem", 24: "6rem" }   # --space-{k}
    radius: { xs: 4px, sm: 6px, md: 8px, lg: 12px, xl: 16px, full: 9999px }   # --radius-{k}
    shadow:                          # --shadow-{k}
      sm: "0 1px 2px 0 #0000000d"
      md: "0 4px 6px -1px #0000001a, 0 2px 4px -2px #0000001a"
      lg: "0 10px 15px -3px #0000001a, 0 4px 6px -4px #0000001a"
      xl: "0 20px 25px -5px #0000001a, 0 8px 10px -6px #0000001a"
      popover: "0 12px 24px -4px rgba(16, 24, 40, .14), 0 4px 8px -2px rgba(16, 24, 40, .06)"   # template: row menu, rows-per-page
    zIndex:                          # tumpukan lapisan (urut naik)
      stickyTableCell: 3             # neudela sticky Actions column
      filterPanel: 6
      pageSizePopover: 41
      topbar: 50
      modalBackdrop: 1000            # neudela
      rowMenu: 1050
      toast: 1100
    motion:
      tableRefreshFade: "opacity .15s"
      refreshSpin: "lt-spin 0.9s linear infinite"
      skeletonShimmer: "dt-shimmer 1.4s ease infinite"
      chevronRotate: "transform .15s"
      reducedMotion: [refresh spin off, skeleton shimmer off, theme crossfade off]
    scrollbar:
      width: thin
      color: "var(--color-border-hover) transparent"
      webkit: { size: 10px, thumbBorder: "2px solid transparent", thumbRadius: 999px, track: transparent }

  # ── Layout ────────────────────────────────────────────────────────────────────────
  # Posisi dan ukuran region. Nilai bertanda {{template.layout.*}} di template.styles
  # diambil dari sini.
  layout:
    breakpoints:
      mobile: 767px          # ListTable/Detail/Overview: (max-width: 767px) → kartu, stack
      shellCollapse: 768px   # App.css: (max-width: 768px) → sidebar jadi baris tab horizontal
      tablet: 1024px         # App.css: (max-width: 1024px) → hero/split 1 kolom, KPI 2 kolom
      formStack: 640px       # Form.css: (max-width: 640px) → grid form 1 kolom
    shell:
      structure: |
        ┌────────────────────────── topbar (sticky, full width) ──────────────────────────┐
        │ [logo N] Title / caption                                       [Dark mode ◯]   │
        ├──────────────┬─────────────────────────────────────────────────────────────────┤
        │ sidebar      │ content (fluid, padding)                                         │
        │ (sticky)     │   page: breadcrumb → page header → card(s)                       │
        │ nav items    │                                                                  │
        └──────────────┴─────────────────────────────────────────────────────────────────┘
      root: { className: lab-shell, minHeight: 100vh, direction: column }
      topbar:
        className: lab-topbar
        position: sticky-top
        height: 60px
        paddingX: "var(--space-6)"
        background: "var(--color-bg-surface)"
        borderBottom: "1px solid var(--color-border)"
        slots:
          left:                               # brand
            logo: { className: lab-topbar__logo, size: 32px, radius: "var(--radius-md)", background: "var(--color-primary)", color: "var(--color-text-on-primary)", text: "{{app.brand.logoLetter}}" }
            title: { className: lab-topbar__title, text: "{{app.brand.title}}" }
            caption: { className: lab-topbar__caption, text: "{{app.brand.caption}}", hiddenBelow: shellCollapse }
          right: [theme-toggle]
      sidebar:
        className: lab-sidebar
        element: nav
        ariaLabel: Main
        position: sticky (top = topbar.height)
        width: 248px
        height: "calc(100vh - topbar.height)"
        padding: "var(--space-4) var(--space-3)"
        itemGap: "var(--space-1)"
        background: "var(--color-bg-sidebar)"
        borderRight: "1px solid var(--color-border)"
        item:
          component: NavLink
          className: lab-nav-item
          activeClass: is-active
          iconSize: 18
          exactMatchFor: ["/"]                # end={path === '/'}
        belowShellCollapse: horizontal scroll row, border-bottom, item nowrap
        itemsSource: "{{app.navigation}}"
      content:
        className: lab-content
        element: main
        padding: "var(--space-8)"
        paddingMobile: "var(--space-4)"
    page:
      className: lab-page
      width: fluid                            # 100%, tanpa max-width: zoom kecil tetap penuh kiri–kanan
      gap: "var(--space-5)"
      order: [breadcrumb, header, content]
      header:
        className: lab-page__header
        align: "space-between, flex-end, wrap"
        title: { element: h1, className: lab-page__title, size: "var(--fs-display-xs)" }
        subtitle: { element: p, className: lab-page__subtitle, maxWidth: 72ch }

  # ── Komponen ──────────────────────────────────────────────────────────────────────
  # Kontrak setiap pola: anatomi (urutan dan posisi), primitive neudela, props,
  # perilaku, aksesibilitas, dan copy. Ukuran dan warna ada di template.styles (selector disebut di `css`).
  components:

    # ── List card ──────────────────────────────────────────────────────────────────
    listTable:
      file: src/components/list-table/ListTable.tsx
      css: .lt
      element: "section[aria-labelledby=<title id>]"
      anatomy:                                  # urutan atas → bawah
        - header          # .lt-head: title + count chip, description
        - toolbar         # .lt-toolbar
        - filterPanel     # .lt-filters (hanya saat dibuka)
        - filterChips     # .lt-fchips (hanya saat ada filter terpasang)
        - body            # error | empty | (inline error) + table/mobile cards + footer
      defaults:
        minTableWidth: 960px
        pageSize: 10
        pageSizeOptions: [5, 10, 25, 50]
        showRowNumbers: true
        buttonActionVariant: inline             # app menimpa ke "menu"
      props:                                     # props generik yang diisi per halaman
        title: string
        description: string?
        noun: "[singular, plural]"
        columns: "NeuronTableColumn[] — semua kolom punya width kecuali SATU kolom teks fleksibel"
        minTableWidth: number
        rowKey: string
        onRowClick: optional → buka detail
        rowActions: "{key,label,ariaLabel(row),icon,tone: brand|neutral|danger,onClick}[]"
        buttonActionVariant: "inline | menu"
        rowLabel: "(row) => string — nama baris untuk trigger ⋯"
        renderMobileCard: "(row) => {id,title,subtitle?,meta?,badge?}"
        searchPlaceholder: string
        sortOptions: "{key,label}[]"
        filterFields: "{key,label,type: text|date,param?,list?,placeholder?}[]"
        primaryAction: "{label,icon,onClick}"
        emptyTitle: string
        emptyBody: string
        bulkAction: "tidak dipakai (tanpa checkbox/bulk delete); seleksi hanya muncul bila diberikan"
      header:
        title: { element: h2, className: lt-head__title }
        countChip: { className: lt-chip, text: "{total} {noun[0] if total == 1 else noun[1]}", hiddenWhen: "error && no rows" }
        description: { className: lt-head__desc }
      toolbar:
        css: .lt-toolbar
        note: "Dibangun di luar NeuronTable: toolbar bawaan NeuronTable memfilter ulang halaman aktif di client dan tidak punya slot panel filter."
        left:                                    # urutan kiri → kanan
          - filterButton:
              component: NeuronButton
              props: { variant: secondary, leadingIcon: { icon: Filter, size: 15 } }
              label: { idle: Filter, active: "Filter · {count}" }
              activeClass: is-active             # saat ≥1 filter terpasang (tinted brand)
              aria: { expanded: filterOpen }
              visibleWhen: "filterFields.length > 0"
              action: toggle filter panel
          - sortMenu:
              component: NeuronDropdownMenu
              props: { align: start, width: 220, showHeader: false, header: false }
              items: "sortOptions → {type: radio, checked: active, trailingIcon: ArrowUp|ArrowDown 15 pada yang aktif}"
              trigger:
                component: NeuronButton
                props: { variant: secondary, leadingIcon: { icon: ArrowUpDown, size: 15 }, trailingIcon: "ArrowUp|ArrowDown 14 bila ada sort" }
                label: { idle: Sort By, active: "Sort By: {label}" }
                aria: { haspopup: menu, expanded: open, label: "Sort By: {label}, ascending|descending (saat aktif)" }
              behavior: "Pilih kolom baru → asc; pilih kolom yang sama saat asc → desc; menu tertutup setelah memilih; halaman kembali ke 1."
              visibleWhen: "sortOptions.length > 0"
          - refreshButton:
              component: NeuronButton
              props: { variant: secondary, leadingIcon: { icon: RefreshCw, size: 15 } }
              label: Refresh
              whileLoading: { disabled: true, ariaBusy: true, className: is-spinning }
              visibleWhen: onRefresh given
        leftWhileSelected: ["{count} selected", "NeuronButton danger = bulkAction", "NeuronButton text: Clear"]   # hanya bila bulkAction
        right:
          - search:
              css: .lt-toolbar__search
              component: NeuronInput
              props: { leadingIcon: { icon: Search, size: 16 } }
              aria: { label: Search records in table }
              placeholder: "{page.searchPlaceholder}"
              clearButton: { css: .lt-toolbar__clear, icon: { name: X, size: 14 }, aria: Clear search, visibleWhen: "value != ''" }
              debounceMs: 300                    # nilai dikirim ke API setelah 300ms, di-trim
          - primaryAction:
              component: NeuronButton
              props: { variant: primary, leadingIcon: "{icon}" }
              rule: "Satu-satunya tombol primary di list card."
        mobile: "search satu baris penuh; primary action lebar penuh di bawahnya"
      filterPanel:
        file: ListTableFilterPanel.tsx
        css: .lt-filters
        element: "form[aria-label=Filters][noValidate]"
        model: "Draft. Perubahan baru berlaku saat Apply filters (atau Enter). Satu kondisi per field."
        initialDrafts: "salinan filter yang terpasang; bila kosong → satu kondisi kosong untuk field pertama"
        row:
          css: .lt-filters__row
          columns: "52px minmax(160px, 220px) 86px minmax(220px, 360px) 32px"
          cells:
            - conjunction: { text: { first: Where, rest: and }, ariaHidden: true }
            - field: { component: NeuronDropdown, props: { size: sm }, options: "field yang belum dipakai + field baris ini", wrapperAria: "group: Filter {n} field", onChange: "reset kondisi ke kosong untuk field baru" }
            - operator: { text: { text: contains, date: is between } }
            - value:
                text: { component: NeuronInput, aria: "{label} contains", placeholder: "{field.placeholder} atau Type {label lowercase}" }
                date: { component: NeuronDatePicker, props: { mode: range, trigger: popover, size: sm, placement: auto, showPresets: true, placeholder: Select a date range }, wrapperAria: "group: {label} between" }
            - remove: { component: NeuronButton, props: { variant: text, size: sm, iconOnly: true }, icon: { name: X, size: 16 }, aria: "Remove {label} filter", title: Remove condition }
        emptyText: "No conditions — Apply shows every record."
        footer:
          left: { component: NeuronButton, props: { variant: text, size: sm, leadingIcon: { icon: Plus, size: 14 } }, label: Add filter, disabledWhen: "semua field sudah dipakai" }
          right:
            - { component: NeuronButton, props: { variant: secondary, size: sm }, label: Cancel, action: close panel tanpa menerapkan }
            - { component: NeuronButton, props: { variant: outline, size: sm, type: submit }, label: Apply filters, note: "outline, bukan primary: primary tetap milik tombol create" }
        onApply: "buang kondisi tidak lengkap → terapkan → tutup panel → halaman 1"
        mobile: "baris = [field, remove] / [value]; conjunction + operator disembunyikan"
      filterChips:
        file: ListTableFilterChips.tsx
        css: .lt-fchips
        label: Filtered by
        chip:
          text:
            text: { label: "{Field} contains", value: "“{value}”" }
            date: { label: "{Field}", value: "{date range label}" }
          remove: { icon: { name: X, size: 12 }, aria: "Remove filter: {label} {value}" }
        clearAll: { component: NeuronButton, props: { variant: text, size: sm }, label: Clear all }
        note: "Markup sendiri, bukan NeuronBadge onClose: tombol close badge selalu berlabel 'Remove badge'."
      table:
        component: NeuronTable
        css: .lt-table
        layout: "table-layout: fixed; min-width = minTableWidth; di bawahnya wrapper scroll horizontal, kolom Actions tetap sticky"
        props: { rowKey: "{rowKey}", loading: "loading && no rows (skeleton hanya load pertama)", selectable: "!!bulkAction", sortColumn: sort.columnKey, sortDirection: sort.direction }
        refreshing: "loading && ada rows → opacity .55 (rows lama tetap tampil)"
        sorting: "header kolom sortable memanggil onSortChange (server-side, halaman 1)"
        rowClick: "seluruh baris membuka detail bila onRowClick diberikan (cursor pointer, hover = --color-primary-light)"
        columns:
          prepend:
            rowNumber: { key: __no, label: "No", width: 64, render: "{offset + index + 1}.", className: lt-cell-no, continuesAcrossPages: true }
          append:
            actions:
              key: __actions
              label: Actions
              align: right
              sticky: right
              width: { menu: 80, inline: "40 + 36 × jumlah aksi" }
        cellRenders:                             # kosakata render kolom (dipakai app.pages.*.columns)
          id-link:        { className: "lt-cell-ellipsis lt-cell-id", title: value, column: { clickable: true, onClick: open detail }, look: "mono 13px, --color-primary-hover" }
          primary:        { className: lt-cell-primary, title: value, look: "medium, ellipsis" }
          ellipsis:       { className: lt-cell-ellipsis, title: value, empty: em-dash }
          mono-muted:     { className: "lt-cell-ellipsis lt-cell-mono lt-cell-muted", title: value }
          mono:           { className: "lt-cell-ellipsis lt-cell-mono", title: value }
          mono-plain:     { className: lt-cell-mono, look: "mono 13px, tanpa ellipsis/title" }
          count-badge:    { component: NeuronBadge, props: { variant: gray, size: sm, pill: true }, leadingIconSize: 12, text: "{count} {one|many}" }
          datetime-stack: { className: lt-cell-stack, main: "formatDateTime(value) (lt-cell-stack__main)", sub: "formatRelativeTime(value) (lt-cell-stack__sub)" }
          ref-stack:      { className: lt-cell-stack, main: "name ?? id (lt-cell-ellipsis)", sub: "id mono bila name dan id ada (lt-cell-stack__sub lab-mono)", empty: em-dash }
          em-dash:        { className: lt-cell-empty, text: "—" }
          # Kolom boleh menulis title: false → render tanpa atribut title (mis. kolom Value di detail).
          placeholder:    { className: lt-cell-empty, text: "{column.emptyText}" }
      rowActions:
        variants:
          inline:
            component: NeuronButton
            props: { variant: text, size: sm, iconOnly: true }
            className: "lt-action lt-action--{tone}"
            title: "{label}"
            aria: "{ariaLabel(row)}"
            stopPropagation: true
          menu:                                  # buttonActionVariant="menu" — dipakai template
            file: ListTableRowMenu.tsx
            trigger:
              component: NeuronButton
              props: { variant: text, size: sm, iconOnly: true }
              icon: { name: MoreHorizontal, size: 16 }
              className: "lt-action lt-action--menu (+ is-open)"
              aria: { label: "Actions for {rowLabel(row)}", haspopup: menu, expanded: open }
              title: Actions
            menu:
              css: .lt-rowmenu
              portal: document.body
              position: fixed
              width: 188px
              gap: 4px
              align: "right edge = trigger right edge; clamp kiri/kanan 8px dari viewport"
              flip: "buka ke atas bila ruang di bawah < tinggi menu + 4px dan ruang di atas cukup"
              item: { element: "button[role=menuitem]", className: "lt-rowmenu__item lt-rowmenu__item--{tone}", content: [icon, label] }
              keyboard: { ArrowDown/ArrowUp on trigger: "buka, fokus item pertama/terakhir", ArrowDown/ArrowUp: pindah (berputar), Home/End: ujung, Escape: tutup + fokus trigger, Tab: tutup }
              closeOn: [item click, outside mousedown, scroll di luar menu, Escape]
              focus: "item aktif difokus setelah menu visible (bukan saat visibility:hidden)"
        tones: { brand: aksi utama (View), neutral: biasa, danger: hapus }
        mobile: "Kartu mobile selalu menampilkan aksi sebagai tombol berlabel (bukan menu)."
      footer:
        file: ListTablePagination.tsx
        css: .lt-footer
        anatomy: [rowsPerPage + range, pageNumbers, prevNext]
        range: { text: "{from}–{to} of {total}", hiddenWhen: compact }
        pageNumbers:
          element: "nav[aria-label=Table pagination]"
          button: { className: "lt-page (+ is-active)", aria: "Page {n}", current: "aria-current=page" }
          algorithm: |
            count ≤ 7            → 1..count
            current ≤ 4          → 1 2 3 4 5 … count
            current ≥ count − 3  → 1 … count−4 count−3 count−2 count−1 count
            selain itu           → 1 … current−1 current current+1 … count
          gap: { text: "…", ariaHidden: true }
          hiddenWhen: compact
        prevNext:
          - { component: NeuronButton, props: { variant: secondary, size: sm }, label: Previous, aria: Previous page, disabledWhen: "page 1" }
          - { component: NeuronButton, props: { variant: secondary, size: sm }, label: Next, aria: Next page, disabledWhen: "halaman terakhir" }
        compact: "lebar ≤ {{template.layout.breakpoints.mobile}}: hanya rows-per-page + Previous/Next"
        rowsPerPage:
          file: ListTablePageSize.tsx
          css: .lt-psize
          label: Rows per page
          trigger: { element: button, ariaHaspopup: listbox, content: [value, { icon: ChevronDown, size: 14 }] }
          popover: { opens: up, offset: 6px, caption: none }
          option: { role: option, selected: "aria-selected + Check 14", content: "{n}" }
          keyboard: { ArrowDown/ArrowUp on trigger: buka, ArrowDown/ArrowUp/Home/End: pindah, Enter/Space: pilih, Escape: tutup + fokus trigger, Tab: tutup }
          closeOn: [pick, outside mousedown, Escape]
          onChange: "ganti page size → halaman 1"
          note: "Listbox custom: <select> native digambar OS tanpa style; NeuronDropdown membuka ke bawah dan NeuronDropdownMenu tidak punya state selected."
      states:
        loadError:                                # error && belum ada rows
          css: .lt-state
          component: NeuronAlert
          props: { variant: danger }
          title: "{Plural capitalized} could not be loaded"
          description: "{error}"
          actions: [{ label: Try again, onClick: retry }]
        refreshError:                             # error && rows lama masih ada
          css: ".lt-state .lt-state--inline"
          component: NeuronAlert
          props: { variant: danger, size: sm }
          title: Refresh failed
          description: "{error}"
          actions: [{ label: Try again, onClick: retry }]
        empty:
          css: .lt-empty
          icon: { default: FileSpreadsheet, narrowed: SearchX, size: 26 }
          copy:
            default: { title: "{emptyTitle}", body: "{emptyBody}" }
            searching: { title: "No {plural} match “{q}”", body: Try adjusting your keywords. }
            filtered: { title: "No {plural} match this filter | these filters", body: Remove a filter chip or clear them all to see the full list. }
          action: { visibleWhen: "searching || filtered", component: NeuronButton, props: { variant: secondary }, label: Clear search and filters }
      mobileCards:
        file: ListTableMobileList.tsx
        css: .lt-cards
        when: "lebar ≤ {{template.layout.breakpoints.mobile}} (useMediaQuery('(max-width: 767px)'))"
        card: ["rowNumber {n}.", "id (mono) + badge", title, subtitle, meta, actions]
        actions: { component: NeuronButton, props: { variant: secondary }, leadingIcon: "{icon}", label: "{label}", height: 44px, className: "lt-card__action lt-card__action--{tone}" }
        main: "button: seluruh area utama kartu membuka detail"

    # ── Detail page ────────────────────────────────────────────────────────────────
    detailPage:
      routing: in-page-state             # list → detail lewat state (detailId), bukan route; kembali = onBack
      container: "lab-page dt-page"
      anatomy: [header, tabs, tabPanel]
      header:
        file: src/components/detail/DetailHeader.tsx
        css: .dt-header
        breadcrumb: { component: NeuronBreadcrumb, items: "[{label: {app root label}, onClick: back}, {label: {record.name}}]", rule: "crumb terakhir = NAMA record, bukan id" }
        title: { element: h1, className: dt-header__title, text: "{record.name}" }
        badges: optional, setelah title
        recordId: { className: dt-header__id, text: "{record.id}", mono: true, copy: CopyButton }
        description: { className: dt-header__desc, text: "{record.description}", maxWidth: 80ch }
        actions: { position: right, items: [{ component: NeuronButton, props: { variant: secondary, leadingIcon: { icon: ArrowLeft, size: 16 } }, label: Back to list, onClick: back }] }
      copyButton:
        file: src/components/detail/CopyButton.tsx
        css: .dt-copy
        icon: { idle: Copy, done: Check, size: 14 }
        aria: Copy ID
        title: { idle: Copy ID, done: Copied }
        liveRegion: "Copied to clipboard"
        resetMs: 1500
      tabs:
        file: src/components/detail/DetailTabs.tsx
        css: .dt-tabs
        pattern: "WAI-ARIA tablist: roving tabindex, ←/→/Home/End dengan aktivasi otomatis"
        ids: { tab: "{idPrefix}-tab-{key}", panel: "{idPrefix}-panel-{key}" }
        tab: { content: [icon 15, label, count pill], activeClass: is-active }
        panel: { role: tabpanel, tabIndex: 0, css: .dt-panel }
        rule: "Tidak ada tab JSON / raw response."
      overview:
        css: .dt-overview-stack
        layout: |
          [ stat strip — grid auto-fit minmax(170px, 1fr) ]
          [ main: flex 2 1 560px ][ aside: flex 1 1 320px, aria-label "Record details" ]
          gap 20px; wrap → satu kolom saat sempit
        blocks:                            # block yang boleh dipakai app.pages.*.detail.overview
          stat-strip:   { component: StatStrip, item: "{key,label,icon 14,value,hint,onClick→tab,ariaLabel}", css: .dt-stats }
          rule-flow:    { component: RuleSection ×2 (when/then), css: .dt-rules, item: "{title, variable, value, ids[]}", whenIcon: GitBranch 15, thenIcon: SlidersHorizontal 15 }
          entity-rows:  { component: EntityRows, css: .dt-erows, item: "{icon 16, title, subtitle, meta(mono)}" }
          timeline:     { component: Timeline, css: .dt-timeline, item: "{icon 14, title, time(mono), sub}", firstItemHighlighted: true }
          key-value:    { component: KeyValueList, css: .dt-kv, item: "{label, value, mono?, sub?}", skipEmpty: true }
        previewRows: 5
      card:
        file: src/components/detail/DetailCard.tsx
        component: DetailCard
        css: .dt-card
        head: [title h2, count chip (.lt-chip), actions (kanan)]
        flush: "body tanpa padding untuk tabel / list (.dt-card__body--flush)"
        viewAll: { element: button, className: dt-link, text: View all, aria: "{label}" }
        search: { component: DetailSearch, css: .dt-search, aria: "{label}", sameSkinAs: listTable.toolbar.search, filtering: client-side (searchableText) }
      collectionTab:                       # satu tab per properti array
        card: DetailCard
        count: "{n} {one|many}"
        actions: [DetailSearch, ViewToggle]
        views:
          card: { component: EntityGrid + EntityCard, css: ".dt-entity-grid, .dt-entity", grid: "repeat(auto-fill, minmax(280px, 1fr))" }
          table: { component: DetailTable, minWidth: 560px, rowNumberWidth: 56, pageSize: 10, pagination: "client-side, muncul bila rows > 10", pageSizeOptions: [5, 10, 25, 50] }
        emptyText: { none: "No {title lowercase}.", noMatch: "Nothing matches “{q}”." }
        searchResetsPaging: true            # DetailTable di-remount (key = query)
      viewToggle:
        file: src/components/detail/ViewToggle.tsx
        component: NeuronButtonGroup
        props: { type: radio, size: sm, ariaLabel: View mode }
        options:
          - { value: card, icon: LayoutGrid, size: 16, iconOnly: true, ariaLabel: Card view }
          - { value: table, icon: List, size: 16, iconOnly: true, ariaLabel: Table view }
      entityCard:
        css: .dt-entity
        anatomy: [icon tile 36px (icon 18), title, subtitle, fields dl (label | value)]
        skipEmptyFields: true
      loading:
        ariaBusy: true
        srStatus: "Loading {entity lowercase}…"
        skeleton: [crumb 220×14, title 360×28, text 520×14, tabs 100%×40, "overview: main card 220 tinggi + aside card 220 tinggi"]
      notFound:
        when: "GET retrieve gagal (status apa pun) → data null"
        header: { breadcrumbs: "[root, {label: {id}}]", title: "{app.notFound.title}", actions: [Back to list] }
        alert: { component: NeuronAlert, props: { variant: danger }, title: "{app.notFound.alertTitle}", description: "{app.notFound.alertDescription}" }
        toast: "pesan error juga dikirim ke toast"
      nested:                                    # resource bertingkat (OAS /parent/{id}/child), mis. TMF673 GeographicSubAddress
        tab: "satu tab per resource nested; bila parent juga meng-embed list yang sama, tab nested MENGGANTIKAN tab embedded"
        list: "ResourceListPage embedded (tanpa breadcrumb/judul halaman): toolbar, filter=, sort, paging, create/edit/delete sesuai operasi API — data dari {service}(parentId) = nestedResourceService(path)"
        record: "baris → record nested (GET /parent/{id}/child/{childId}) menggantikan halaman parent; breadcrumb [root, parent, child]; tombol 'Back to {parent}'; kembali ke tab nested"
        overviewAsideOnly: "record tanpa blok main → kartu aside berbagi lebar penuh (.dt-overview--aside-only)"
        mock: "item nested membawa __parent (khusus mock); seed dari list embedded parent bila ada"

    # ── Form dialog (create + edit) ────────────────────────────────────────────────
    # edit: dialog yang sama dibuka dengan record (tombol Edit di header record / menu baris):
    #   field = form.edit.fields (subset _MVO), prefill = kebalikan payload (valuesFromRecord),
    #   PATCH = hanya atribut form.edit.payload yang berubah (dikosongkan → null, list → []);
    #   tanpa perubahan → toast form.edit.noChanges, tanpa request. @type root tidak pernah dikirim.
    formDialog:
      file: src/components/form/FormDialog.tsx
      css: .fm-dialog
      component: NeuronModal
      props: { size: lg, showCloseButton: false, closeOnBackdrop: false }
      widths: { wide: 760px, narrow: 520px }   # wide = ada repeatable group; narrow = sedikit field
      close: [Cancel, Escape]                   # TIDAK ada tombol ✕ di atas
      anatomy: [title, description, body (scroll), footer (sticky)]
      footer:
        css: .fm-actions
        buttons:                                # berbagi lebar 1:1
          - { component: NeuronButton, props: { variant: secondary, type: button }, label: Cancel, disabledWhen: submitting }
          - { component: NeuronButton, props: { variant: primary, type: submit, form: "{formId}" }, label: "{submitLabel}", loadingWhen: submitting }
      form: { element: "form#{formId}[noValidate]", css: .fm-form }
      errorSummary:
        when: "submit gagal validasi (errorCount > 0)"
        position: top of body
        element: "div[tabIndex=-1][role=alert].fm-summary"
        component: NeuronAlert
        props: { variant: danger }
        title: "{n} field needs attention | {n} fields need attention"
        description: Fields with errors are outlined in red.
        focus: "menerima fokus pada setiap submit gagal"
        hidesWhen: "semua error sudah diperbaiki"
      resetOnOpen: true
      parts:
        section: { component: FormSection, css: .fm-section, head: ["title h3 (+ ' *' merah bila required)", hint kanan] }
        grid: { component: FormGrid, css: .fm-grid, columns: [2, 3], stackBelow: formStack }
        repeatableItem:
          component: RepeatableItem
          css: .fm-item
          element: "div[role=group][aria-label={title}]"
          head: ["number badge {n}", title, remove button]
          remove: { component: NeuronButton, props: { variant: text, size: sm, iconOnly: true }, icon: { name: Trash2, size: 16 }, aria: "{removeLabel}", title: { enabled: Remove, disabled: At least one is required } }
        addItem: { component: AddItemButton, css: .fm-add, icon: { name: Plus, size: 16 }, text: "{label}", look: "dashed, full width, 40px" }
        emptyText: { css: .fm-empty }
        optionalMark: { component: OptionalMark, text: Optional, slot: labelAction }
      controls:                                  # kosakata control field (dipakai app.pages.*.form)
        text:     { component: NeuronInput, props: [label, aria-label, required, aria-required, aria-invalid, placeholder, "state: error|default", "helperText: pesan error ?? field.helperText"], manualId: "id tanpa *Ref yang diizinkan generator/libs/neudela/field-policy.yaml: diketik manual (autoComplete off, spellCheck off) + helper text; tanpa manualId validator menolak nama *Id" }
        url:      { component: NeuronInput, props: { type: url }, extends: text }
        textarea: { component: NeuronTextArea, props: [label, "labelAction: OptionalMark", placeholder, "autoResize?", minRows, "maxRows?", "helperText?"] }
        ref:                                     # relasi = LOV, tidak pernah input id
          component: LookupPicker                # src/components/form/LookupPicker.tsx — NeuronDropdown belum punya pencarian async
          look: "kelas NeuronDropdown sendiri (neuron-dropdown / neuron-select __trigger, __dropdown, __option…) → tampilan identik"
          aria: "WAI-ARIA combobox: input[role=combobox][aria-autocomplete=list][aria-expanded][aria-controls][aria-activedescendant] + div[role=listbox] > div[role=option]"
          wrapper: { element: div, role: group, ariaLabel: "{label} (required) | {label}" }
          search: "ketikan → lookup(query) ke API pemilik entity (queryParam lookup), debounce 300ms, respons basi dibuang (seq); query kosong = halaman pertama bersama (useLookups)"
          options: "{label: name || id, description: id}; halaman penuh (= limit) → 'Showing the first {limit} — type to search for more.'"
          keys: { ArrowDown/ArrowUp: "buka / pindah", Enter: pilih, Escape: "tutup list saja (tidak menutup dialog)", Tab: tutup }
          states: { loading: "Searching “{q}”… + spinner", empty: "No matches for “{q}”.", error: "{lookup.error}" }
          onPick: "isi id DAN name sekaligus"
          clear: "tombol ✕ (aria-label 'Clear {label}') hanya pada ref opsional yang terisi"
          helperText: { lookupError: "{lookup.error} (prioritas pertama)", error: "{message}", loading: "Loading options…", empty: No options available from the lookup service. }
          state: "error bila validasi gagal; default selain itu"
        value:    { extends: text, label: "label ?? Value", required: true }
        boolean:  { component: NeuronCheckbox, props: [label, description], payload: "true bila dicentang; opsional + tidak dicentang → tidak dikirim; wajib → selalu dikirim", rule: "checkbox, BUKAN toggle (toggle langsung bertindak, form di-submit)" }
        date:     { component: NeuronDatePicker, props: { mode: single, trigger: popover, size: md, placement: auto, showTodayButton: true }, wrapper: "div.fm-date[role=group] (+ .fm-date--required: asterisk lewat CSS — NeuronDatePicker tidak punya prop required)", value: "ISO 8601, awal hari lokal" }
        enum:     { component: NeuronDropdown, props: [label, placeholder, required, options, state, helperText], options: "nilai enum OAS → { value, label: kata-kata kapital }", wrapper: "div[role=group][aria-label]" }
        number:   { component: NeuronInput, props: { type: text, inputMode: "numeric (integer) | decimal" }, rule: "angka (integer: bilangan bulat) — 'Enter a number.' / 'Enter a whole number.'", payload: "{ from, as: number } → angka JSON", prefill: "String(nilai)" }
        json:     { component: NeuronTextArea, wrapper: div.fm-json (monospace), props: { autoResize: true, minRows: 3, maxRows: 10, spellCheck: false }, jsonType: "object | array (tsType …[])", rule: "JSON.parse + bentuk sesuai jsonType", payload: "{ from, as: json } → JSON hasil parse", prefill: "JSON.stringify(nilai, null, 2)" }
        refSingle: { kind: ref, extends: ref, where: "field top-level untuk *Ref / *RefOrValue tunggal (mis. Category.parent, ProductOffering.serviceLevelAgreement)", payload: "{ lovRef, type: <Ref>, referredType }" }
        group:    { kind: group, component: "FormSection + FormGrid (2 kolom; 3 bila ≥ 3 atribut)", where: "value object kecil (TimePeriod, Money, Quantity: ≤ 6 atribut skalar)", fields: "kontrol skalar per atribut, aria-label '{group} {atribut}'", payload: "{ object, item: { atribut: { from, as? } }, omitEmpty } — tidak dikirim bila kosong (const @type tidak dihitung)" }
        list:     { kind: list, where: "list di dalam item repeatable (satu level), mis. characteristic → characteristicValueSpecification", css: .fm-sublist, anatomy: [judul + Optional, item RepeatableItem, tombol tambah], payload: "{ array, keepWhen, item | each } di dalam item induk", deeper: "list lebih dalam → dilaporkan generator, tidak dibuatkan input" }
        itemFields: "item repeatable boleh memuat: ref, value (string tunggal entry = wajib), kontrol skalar mana pun (text/boolean/date/enum/number/json, opsional), list"
      layout:                                    # ResourceFormDialog groupFields()
        - "field pendek berurutan (text, url, enum, date) → FormGrid 2 kolom di dialog wide; satu field pendek tetap lebar penuh"
        - "checkbox berurutan → satu .fm-checks (grid auto-fill minmax(200px, 1fr), latar subtle)"
        - "fe-spec mengurutkan: field pendek, checkbox, textarea, list (payload tetap urutan OAS)"
      display:                                   # detail Record (key-value), ekspresi
        boolean: "{ yesNo } → Yes / No"
        date: "{ dateTime } → formatDateTime"
        enum: "{ oneOf, labels } → label yang sama dengan form"
      validation:
        engine: react-hook-form
        mode: onSubmit                            # default RHF: validasi saat submit, re-validate onChange
        arrayRules: "rules.validate pada useFieldArray; dipicu ulang (trigger) setelah item dipilih bila error grup tampil"
      rules:
        - Isi form mengikuti skema *_FVO dari OAS.
        - "Relasi (…Ref) hanya dari LOV; user tidak pernah mengetik id, UUID, atau href."
        - "href, id, @baseType, @schemaLocation diatur backend; @type/@referredType diisi payload builder."

    # ── Confirm dialog (delete) ────────────────────────────────────────────────────
    confirmDialog:
      component: NeuronModal
      props: { variant: danger, size: md }
      icon: { name: Trash2, size: 20 }
      description: "<strong>{name}</strong> + kalimat konsekuensi"
      footer:
        css: .lab-modal-actions
        buttons:
          - { component: NeuronButton, props: { variant: secondary }, label: Cancel, disabledWhen: deleting }
          - { component: NeuronButton, props: { variant: danger }, label: "{confirmLabel}", loadingWhen: deleting }
      note: "Footer custom: footer bawaan NeuronModal selalu merender confirm primary."

    # ── Toast ──────────────────────────────────────────────────────────────────────
    toast:
      file: src/components/Toast.tsx
      css: .lab-toast
      position: fixed bottom-right
      container: { ariaLive: polite }
      component: NeuronAlert
      props: { dismissible: true }
      autoHideMs: 4000
      severities:
        success: { variant: success, title: "{message}" }
        error: { variant: danger, title: Something went wrong, description: "{message}" }
      remountPerMessage: true                     # key = id → pesan baru tidak tersangkut di state dismissed

  # ── API client ────────────────────────────────────────────────────────────────────
  apiClient:
    file: src/service/api.ts
    baseUrl: "import.meta.env.VITE_API_BASE_URL ?? '' (kosong = same-origin, diproxy dev server)"
    url: "{baseUrl}{app.api.basePath}{endpoint}{queryString}"
    headers:
      Content-Type: application/json
      X-API-Key: "VITE_API_KEY (hanya bila di-set)"
    queryString:
      arrays: repeat-key                        # name=a&name=b → di-AND
      skip: [undefined, "''"]
    pagination:
      scheme: offset-limit (TMF630)
      request: { offset: "page × pageSize", limit: pageSize }
      response: { total: "header X-Total-Count (fallback: panjang data)", resultCount: "header X-Result-Count (fallback: panjang data)" }
    sort: { param: sort, format: "{columnKey} (naik) | -{columnKey} (turun)  — TMF630" }
    filters:                                    # dari ListTable filter panel (TMF630 style)
      param: filter                             # TMF630 JSONPath, sama dengan common/filter backend hasil generate
      text: "@.{attr}=~/{value trimmed, karakter pola di-escape}/i  (contains, abaikan huruf besar/kecil)"
      date: "@.{attr}>='{awal hari lokal, ISO}' && @.{attr}<='{akhir hari lokal 23:59:59.999, ISO}'"
      search: "kotak search = satu kondisi text pada card.searchParam"
      scope: "kondisi pada resource → satu filter=$[?( … && … )]; field ber-list → filter={list}[?( … )] per kondisi (cocok bila satu elemen cocok)"
      combine: "semua filter= di-AND oleh backend"
      attr: "{param ?? key}; boleh dot-path ke ref (category.id), relatif terhadap list bila list di-set"
    errors:
      class: ApiError { status, message, body }
      message: "body.message || body.error || 'HTTP {status}'"
      network: "Error.message; selain itu 'An unexpected error occurred'"
    delete: "202 → {accepted: true} (async), 204 → {accepted: false} (sync); body tidak dibaca"
    staleGuard: "requestSeq: response dari query lama diabaikan"
    lookup:                                     # LOV → API TMF pemilik entity, langsung (tanpa tabel pemetaan)
      request: "GET {baseUrl}{basePath}{path}?limit={limit}[&{queryParam}={query trimmed}]  (query kosong → tanpa queryParam)"
      response: "array → {id: item[valueField], name: item[labelField] ?? item[valueField], href}"
      errors:                                   # LookupError → pesan ramah di bawah picker; form tetap terbuka
        unconfigured: { when: "baseUrl kosong", text: "Couldn't load {noun} — the {service} service isn't connected yet." }
        unavailable: { when: "network error / status non-OK / body bukan array", text: "Couldn't load {noun} — the {service} service is unavailable. Reopen the form to try again." }
      retry: "lookup yang gagal dimuat ulang setiap kali form dibuka"
      initialLoad: "query '' saat mount; debounce 300ms untuk pencarian berikutnya"

  # ── Formatter ─────────────────────────────────────────────────────────────────────
  formatters:
    file: src/components/list-table/format.ts
    locale: browser default (Intl, locale undefined)
    dateTime: { options: { day: numeric, month: short, year: numeric, hour: 2-digit, minute: 2-digit }, empty: "—" }
    day: { options: { day: numeric, month: short, year: numeric } }
    relative: { numeric: auto, units: [year=365d, month=30d, week=7d, day, hour, minute], belowMinute: "RelativeTimeFormat(0, 'minute')", empty: "''" }
    dateRangeLabel: { both: "Day.formatRange(from, to) (tanggal sama → satu tanggal)", fromOnly: "from {day}", toOnly: "until {day}", none: any date }
    rawValuesInRows: true                       # rows menyimpan ISO mentah; format hanya di render (NeuronTable mengurutkan nilai mentah)

  # ── Aturan desain (normatif) ──────────────────────────────────────────────────────
  rules:
    - Satu tombol primary per konteks (list card, dialog).
    - Tidak ada checkbox seleksi baris / bulk delete; baris dinomori "No" (1., 2., …).
    - Aksi baris memakai menu ⋯ (buttonActionVariant = menu) di tabel; tombol berlabel di kartu mobile.
    - Refresh ada di toolbar tabel, sejajar Filter dan Sort By.
    - Layout fluid penuh kiri–kanan; tidak ada max-width halaman.
    - Breadcrumb halaman detail diakhiri NAMA record.
    - Detail tidak menampilkan JSON mentah; semua atribut response dipetakan ke UI (card / tabel / key-value).
    - Overview detail tidak boleh hanya tabel (stat strip, rule flow, entity rows, timeline, key-value).
    - Form create tanpa tombol ✕; tutup lewat Cancel / Escape.
    - Relasi hanya dari LOV; tidak ada input id / UUID / href.
    - Tidak ada "Data as of".
    - Tema berganti serentak; dark mode menutup scrollbar dan color-scheme root.
    - Tidak ada status berbasis warna saja; ikon selalu punya label (aria-label / title / teks).
    - NeuronTooltip size tidak dipakai; tooltip tidak menjadi satu-satunya sumber info penting.

  # ── Styles ────────────────────────────────────────────────────────────────────────
  # Semua rule CSS template, per stylesheet, URUTAN = urutan cascade (jangan diurutkan ulang).
  # decl = properti → nilai CSS literal. {{template.*}} = knob dari template.layout /
  # template.theme / template.components (ubah di sana, bukan di sini).
  # Warna selalu lewat token var(--color-*) → otomatis ikut light/dark (.dark-theme).
  # Dibangkitkan oleh generator/tools/neudela-yaml-sync.mjs --write; jangan diedit manual.
  styles:
    emit: rules-in-order
    loadOrder: [neudela/style.css, src/index.css, src/App.css, "stylesheet komponen (diimport oleh komponennya)"]
    sheets:
      - id: base
        file: src/index.css
        importedBy: [src/bootstrap.tsx, src/federation/createProtectedPage.tsx]
        note: "Base: font mono, color-scheme, theme switch, scrollbar, body."
        rules:
          - select: ":root"
            note: "neudela/style.css only styles .neuron-* classes and never touches bare elements, so the page base (font, canvas, text colour) is set here from its tokens. Dark mode = `.dark-theme` on <body>, which re-defines the same tokens."
            decl:
              "--lab-font-mono": "{{template.theme.fonts.mono.stack}}"
              color-scheme: "light"
          - select: ":root.dark-theme"
            decl:
              color-scheme: "dark"
          - select: ".theme-switching, .theme-switching *, .theme-switching *::before, .theme-switching *::after"
            note: "Set for one frame while the theme switches (App.tsx applyTheme): every token-driven colour changes at once instead of neudela's transitions trailing behind the shell."
            decl:
              transition: "none !important"
          - select: "::view-transition-old(root), ::view-transition-new(root)"
            note: "the cross-fade of a theme switch (View Transitions API)"
            decl:
              animation-duration: "{{template.theme.darkMode.switch.crossfade.duration}}"
              animation-timing-function: "{{template.theme.darkMode.switch.crossfade.easing}}"
          - select: ":root"
            note: "Thin scrollbars on neudela tokens (inherited by every scroller, incl. modal bodies)."
            decl:
              scrollbar-width: "thin"
              scrollbar-color: "var(--color-border-hover) transparent"
          - select: "::-webkit-scrollbar"
            decl:
              width: "10px"
              height: "10px"
          - select: "::-webkit-scrollbar-track"
            decl:
              background: "transparent"
          - select: "::-webkit-scrollbar-thumb"
            decl:
              border: "2px solid transparent"
              border-radius: "999px"
              background-color: "var(--color-border-hover)"
              background-clip: "padding-box"
          - select: "::-webkit-scrollbar-corner"
            decl:
              background: "transparent"
          - select: "body"
            decl:
              margin: "0"
              font-family: "var(--font-family)"
              background: "var(--color-bg-canvas)"
              color: "var(--color-text-primary)"
              "-webkit-font-smoothing": "antialiased"
              "-moz-osx-font-smoothing": "grayscale"
          - select: "*, *::before, *::after"
            decl:
              box-sizing: "border-box"
      - id: shell
        file: src/App.css
        importedBy: [src/App.tsx, src/federation/createProtectedPage.tsx]
        note: "Shell (topbar, sidebar, content), page header, utilitas lab-*, modal actions, toast, home."
        rules:
          - select: ".lab-shell"
            note: "Lab layer over neudela/style.css. neudela ships no layout or typography primitives, so shell, page and form layout live here as lab-* classes built only from neudela tokens (--space-*, --fs-*, --color-*, --radius-*), which keeps light and dark mode working through `.dark-theme` without extra rules. Shell"
            decl:
              min-height: "100vh"
              display: "flex"
              flex-direction: "column"
          - select: ".lab-topbar"
            decl:
              position: "sticky"
              top: "0"
              z-index: "50"
              height: "{{template.layout.shell.topbar.height}}"
              display: "flex"
              align-items: "center"
              justify-content: "space-between"
              gap: "var(--space-4)"
              padding: "0 var(--space-6)"
              background: "var(--color-bg-surface)"
              border-bottom: "1px solid var(--color-border)"
          - select: ".lab-topbar__brand"
            decl:
              display: "flex"
              align-items: "center"
              gap: "var(--space-3)"
              min-width: "0"
          - select: ".lab-topbar__logo"
            decl:
              width: "32px"
              height: "32px"
              flex-shrink: "0"
              display: "grid"
              place-items: "center"
              border-radius: "var(--radius-md)"
              background: "var(--color-primary)"
              color: "var(--color-text-on-primary)"
              font-weight: "var(--font-weight-bold)"
          - select: ".lab-topbar__title"
            decl:
              font-size: "var(--fs-text-md)"
              line-height: "var(--lh-text-md)"
              font-weight: "var(--font-weight-semibold)"
          - select: ".lab-topbar__caption"
            decl:
              font-size: "var(--fs-text-xs)"
              line-height: "var(--lh-text-xs)"
              color: "var(--color-text-secondary)"
          - select: ".lab-body"
            decl:
              flex: "1"
              display: "flex"
              min-height: "0"
          - select: ".lab-sidebar"
            decl:
              position: "sticky"
              top: "{{template.layout.shell.topbar.height}}"
              width: "{{template.layout.shell.sidebar.width}}"
              height: "calc(100vh - {{template.layout.shell.topbar.height}})"
              flex-shrink: "0"
              display: "flex"
              flex-direction: "column"
              gap: "var(--space-1)"
              padding: "var(--space-4) var(--space-3)"
              background: "var(--color-bg-sidebar)"
              border-right: "1px solid var(--color-border)"
          - select: ".lab-nav-item"
            decl:
              display: "flex"
              align-items: "center"
              gap: "var(--space-3)"
              padding: "var(--space-2) var(--space-3)"
              border-radius: "var(--radius-md)"
              color: "var(--color-text-secondary)"
              font-size: "var(--fs-text-sm)"
              line-height: "var(--lh-text-sm)"
              font-weight: "var(--font-weight-medium)"
              text-decoration: "none"
          - select: ".lab-nav-item:hover"
            decl:
              background: "var(--color-bg-surface-hover)"
              color: "var(--color-text-primary)"
          - select: ".lab-nav-item.is-active"
            decl:
              background: "var(--color-nav-active-bg)"
              color: "var(--color-nav-active-text)"
          - select: ".lab-nav-item:focus-visible"
            decl:
              outline: "2px solid var(--color-primary)"
              outline-offset: "2px"
          - select: ".lab-nav-item__icon"
            decl:
              display: "inline-flex"
          - select: ".lab-content"
            decl:
              flex: "1"
              min-width: "0"
              padding: "{{template.layout.shell.content.padding}}"
          - select: ".lab-page"
            note: "Page Fluid: the page always spans the content area edge to edge — no max-width cap, so a zoomed-out (wide) viewport is filled instead of leaving empty gutters left and right."
            decl:
              display: "flex"
              flex-direction: "column"
              gap: "{{template.layout.page.gap}}"
              width: "100%"
              min-width: "0"
          - select: ".lab-page__header"
            decl:
              display: "flex"
              justify-content: "space-between"
              align-items: "flex-end"
              flex-wrap: "wrap"
              gap: "var(--space-4)"
          - select: ".lab-page__title"
            decl:
              margin: "var(--space-1) 0 0"
              font-size: "var(--fs-display-xs)"
              line-height: "var(--lh-display-xs)"
              font-weight: "var(--font-weight-semibold)"
              color: "var(--color-text-primary)"
          - select: ".lab-page__subtitle"
            decl:
              margin: "var(--space-1) 0 0"
              max-width: "72ch"
              font-size: "var(--fs-text-sm)"
              line-height: "var(--lh-text-sm)"
              color: "var(--color-text-secondary)"
          - select: ".lab-section-title"
            decl:
              margin: "0 0 var(--space-3)"
              font-size: "var(--fs-text-lg)"
              line-height: "var(--lh-text-lg)"
              font-weight: "var(--font-weight-semibold)"
          - select: ".lab-section-lead"
            decl:
              margin: "calc(-1 * var(--space-2)) 0 var(--space-4)"
          - select: ".lab-muted"
            decl:
              color: "var(--color-text-secondary)"
              font-size: "var(--fs-text-sm)"
          - select: ".lab-mono"
            decl:
              font-family: "var(--lab-font-mono)"
              font-size: "var(--fs-text-xs)"
              color: "var(--color-text-secondary)"
              word-break: "break-all"
          - select: ".lab-mono--strong"
            decl:
              color: "var(--color-text-primary)"
          - select: ".lab-break"
            decl:
              word-break: "break-all"
          - select: ".lab-list"
            decl:
              margin: "0"
              padding-left: "1.25rem"
              display: "flex"
              flex-direction: "column"
              gap: "var(--space-2)"
              font-size: "var(--fs-text-sm)"
              line-height: "var(--lh-text-sm)"
              color: "var(--color-text-secondary)"
          - select: ".lab-list code, .lab-section-lead code"
            decl:
              font-family: "var(--lab-font-mono)"
              font-size: "var(--fs-text-xs)"
              color: "var(--color-text-primary)"
          - select: ".lab-pill-list"
            decl:
              display: "flex"
              flex-wrap: "wrap"
              gap: "var(--space-2)"
              margin-top: "var(--space-4)"
          - select: ".lab-modal-actions"
            note: "Modal"
            decl:
              width: "100%"
              display: "flex"
              justify-content: "flex-end"
              gap: "var(--space-2)"
          - select: ".lab-toast"
            note: "Toast (NEUDELA GAP: no Snackbar)"
            decl:
              position: "fixed"
              right: "var(--space-6)"
              bottom: "var(--space-6)"
              z-index: "1100"
              width: "min(400px, calc(100vw - 2 * var(--space-4)))"
              border-radius: "var(--radius-md)"
              box-shadow: "var(--shadow-lg)"
          - select: ".lab-hero"
            note: "Overview"
            decl:
              display: "grid"
              grid-template-columns: "minmax(0, 2fr) minmax(0, 1fr)"
              gap: "var(--space-6)"
              padding: "var(--space-8)"
              border: "1px solid var(--color-border)"
              border-radius: "var(--radius-xl)"
              background: "var(--color-hero-bg)"
          - select: ".lab-hero__eyebrow"
            decl:
              margin: "0"
              font-size: "var(--fs-text-xs)"
              font-weight: "var(--font-weight-semibold)"
              letter-spacing: "0.06em"
              text-transform: "uppercase"
              color: "var(--color-primary)"
          - select: ".lab-hero__title"
            decl:
              margin: "var(--space-2) 0 0"
              font-size: "var(--fs-display-sm)"
              line-height: "var(--lh-display-sm)"
              font-weight: "var(--font-weight-semibold)"
          - select: ".lab-hero__text"
            decl:
              margin: "var(--space-3) 0 0"
              max-width: "60ch"
              font-size: "var(--fs-text-md)"
              line-height: "var(--lh-text-md)"
              color: "var(--color-text-secondary)"
          - select: ".lab-hero__actions"
            decl:
              display: "flex"
              flex-wrap: "wrap"
              gap: "var(--space-3)"
              margin-top: "var(--space-6)"
          - select: ".lab-hero__panel"
            decl:
              padding: "var(--space-5)"
              border: "1px solid var(--color-border)"
              border-radius: "var(--radius-lg)"
              background: "var(--color-bg-surface)"
          - select: ".lab-hero__panel-title"
            decl:
              margin: "0 0 var(--space-3)"
              font-size: "var(--fs-text-sm)"
              font-weight: "var(--font-weight-semibold)"
          - select: ".lab-kpi-grid"
            decl:
              display: "grid"
              grid-template-columns: "repeat(4, minmax(0, 1fr))"
              gap: "var(--space-4)"
          - select: ".lab-kpi__label"
            decl:
              margin: "0"
              font-size: "var(--fs-text-xs)"
              font-weight: "var(--font-weight-medium)"
              color: "var(--color-text-secondary)"
          - select: ".lab-kpi__value"
            decl:
              margin: "var(--space-1) 0 0"
              font-size: "var(--fs-display-xs)"
              line-height: "var(--lh-display-xs)"
              font-weight: "var(--font-weight-semibold)"
          - select: ".lab-kpi__note"
            decl:
              margin: "var(--space-1) 0 0"
              font-size: "var(--fs-text-xs)"
              line-height: "var(--lh-text-xs)"
              color: "var(--color-text-tertiary)"
          - select: ".lab-split"
            decl:
              display: "grid"
              grid-template-columns: "repeat(2, minmax(0, 1fr))"
              gap: "var(--space-4)"
          - select: ".lab-facts"
            note: "Hero \"API\" facts: label over value, stacked."
            decl:
              display: "flex"
              flex-direction: "column"
              gap: "var(--space-3)"
              margin: "0"
          - select: ".lab-facts dt"
            decl:
              font-size: "var(--fs-text-xs)"
              color: "var(--color-text-secondary)"
          - select: ".lab-facts dd"
            decl:
              margin: "2px 0 0"
              font-size: "var(--fs-text-sm)"
              line-height: "var(--lh-text-sm)"
              color: "var(--color-text-primary)"
              overflow-wrap: "anywhere"
          - select: ".lab-pill-row"
            note: "Badges inside a key/value row (right-aligned, wrapping)."
            decl:
              display: "inline-flex"
              flex-wrap: "wrap"
              justify-content: "flex-end"
              gap: "var(--space-2)"
          - select: ".lab-inline-icon"
            decl:
              display: "inline-flex"
              align-items: "center"
              gap: "var(--space-2)"
              margin: "0"
          - media: "(max-width: {{template.layout.breakpoints.tablet}})"
            note: "Responsive"
            rules:
              - select: ".lab-hero, .lab-split"
                decl:
                  grid-template-columns: "1fr"
              - select: ".lab-kpi-grid"
                decl:
                  grid-template-columns: "repeat(2, minmax(0, 1fr))"
          - media: "(max-width: {{template.layout.breakpoints.shellCollapse}})"
            rules:
              - select: ".lab-topbar"
                decl:
                  padding: "0 var(--space-4)"
              - select: ".lab-topbar__caption"
                decl:
                  display: "none"
              - select: ".lab-body"
                decl:
                  flex-direction: "column"
              - select: ".lab-sidebar"
                decl:
                  position: "static"
                  width: "auto"
                  height: "auto"
                  flex-direction: "row"
                  overflow-x: "auto"
                  padding: "var(--space-2) var(--space-4)"
                  border-right: "none"
                  border-bottom: "1px solid var(--color-border)"
              - select: ".lab-nav-item"
                decl:
                  white-space: "nowrap"
              - select: ".lab-content"
                decl:
                  padding: "{{template.layout.shell.content.paddingMobile}}"
              - select: ".lab-hero"
                decl:
                  padding: "var(--space-5)"
              - select: ".lab-kpi-grid"
                decl:
                  grid-template-columns: "1fr"
      - id: listTable
        file: src/components/list-table/ListTable.css
        importedBy: [src/components/detail/DetailCard.tsx, src/components/detail/DetailTable.tsx, src/components/list-table/ListTable.tsx]
        note: "List card: header, toolbar, filter panel, chips, tabel, row actions/menu, footer, rows per page, states, kartu mobile."
        rules:
          - select: ".lt"
            note: "List card — Neudela Logistics Dashboard \"Work queue\", mapped from its hard-coded hex values onto neudela tokens so light and dark both follow `.dark-theme`: #ffffff → --color-bg-surface #d0d5dd → --color-border #f9fafb → --color-bg-subtle #101828/#344054 → --color-text-primary #475467 → --color-text-secondary brand-50 / 200 / 600 / 700 → --color-primary-light / -border / -hover / --color-nav-active-text"
            decl:
              display: "flex"
              flex-direction: "column"
              min-width: "0"
              background: "var(--color-bg-surface)"
              border: "1px solid var(--color-border)"
              border-radius: "var(--radius-lg)"
              box-shadow: "var(--shadow-sm)"
          - select: ".lt > :first-child"
            decl:
              border-top-left-radius: "inherit"
              border-top-right-radius: "inherit"
          - select: ".lt > :last-child"
            decl:
              border-bottom-left-radius: "inherit"
              border-bottom-right-radius: "inherit"
          - select: ".lt-head"
            note: "Header"
            decl:
              padding: "16px 18px 14px"
          - select: ".lt-head__title-row"
            decl:
              display: "flex"
              align-items: "center"
              flex-wrap: "wrap"
              gap: "var(--space-2)"
          - select: ".lt-head__title"
            decl:
              margin: "0"
              font-size: "var(--fs-text-md)"
              line-height: "var(--lh-text-md)"
              font-weight: "var(--font-weight-semibold)"
              color: "var(--color-text-primary)"
          - select: ".lt-chip"
            decl:
              display: "inline-flex"
              align-items: "center"
              height: "22px"
              padding: "0 8px"
              border-radius: "var(--radius-full)"
              border: "1px solid var(--color-primary-border)"
              background: "var(--color-primary-light)"
              color: "var(--color-nav-active-text)"
              font-size: "var(--fs-text-xs)"
              font-weight: "var(--font-weight-medium)"
              white-space: "nowrap"
              font-variant-numeric: "tabular-nums"
          - select: ".lt-head__desc"
            decl:
              margin: "2px 0 0"
              font-size: "13px"
              line-height: "var(--lh-text-sm)"
              color: "var(--color-text-secondary)"
          - select: ".lt-toolbar"
            note: "Toolbar"
            decl:
              display: "flex"
              align-items: "center"
              justify-content: "space-between"
              flex-wrap: "wrap"
              gap: "12px 16px"
              padding: "14px 18px"
              border-top: "1px solid var(--color-border)"
              border-bottom: "1px solid var(--color-border)"
          - select: ".lt-toolbar__left, .lt-toolbar__right"
            decl:
              display: "flex"
              align-items: "center"
              gap: "10px"
              min-width: "0"
          - select: ".lt-toolbar__left"
            decl:
              flex-wrap: "wrap"
          - select: ".lt-toolbar__right"
            decl:
              flex: "1 1 320px"
              justify-content: "flex-end"
          - select: ".lt-toolbar__selected"
            decl:
              font-size: "var(--fs-text-sm)"
              font-weight: "var(--font-weight-medium)"
              color: "var(--color-text-primary)"
              font-variant-numeric: "tabular-nums"
          - select: ".lt-toolbar__btn.is-active"
            note: "Filter button while a filter is applied: brand-tinted, as in the design."
            decl:
              border-color: "var(--color-primary)"
              background: "var(--color-primary-light)"
              color: "var(--color-nav-active-text)"
          - select: ".lt-toolbar__refresh.is-spinning svg"
            note: "Refresh: the icon spins while a request is in flight."
            decl:
              animation: "lt-spin 0.9s linear infinite"
          - keyframes: lt-spin
            frames:
              - select: "to"
                decl:
                  transform: "rotate(360deg)"
          - media: "(prefers-reduced-motion: reduce)"
            rules:
              - select: ".lt-toolbar__refresh.is-spinning svg"
                decl:
                  animation: "none"
          - select: ".lt-toolbar__search"
            decl:
              flex: "1 1 200px"
              min-width: "0"
              max-width: "340px"
          - select: ".lt-toolbar__search .neuron-input-icon--trailing"
            note: "NeuronInput's icon slots are decorative (pointer-events: none); the clear button in the trailing slot has to opt back in."
            decl:
              pointer-events: "auto"
              z-index: "1"
          - select: ".lt-toolbar__clear"
            decl:
              pointer-events: "auto"
              display: "inline-flex"
              align-items: "center"
              justify-content: "center"
              width: "20px"
              height: "20px"
              padding: "0"
              border: "0"
              border-radius: "var(--radius-full)"
              background: "transparent"
              color: "var(--color-text-tertiary)"
              cursor: "pointer"
          - select: ".lt-toolbar__clear:hover"
            decl:
              background: "var(--color-bg-surface-hover)"
              color: "var(--color-text-primary)"
          - select: ".lt-filters"
            note: "Advanced filter panel"
            decl:
              position: "relative"
              z-index: "6"
              display: "flex"
              flex-direction: "column"
              gap: "12px"
              padding: "14px 18px"
              background: "var(--color-bg-subtle)"
              border-bottom: "1px solid var(--color-border)"
          - select: ".lt-filters__rows"
            decl:
              display: "flex"
              flex-direction: "column"
              gap: "10px"
          - select: ".lt-filters__row"
            decl:
              display: "grid"
              grid-template-columns: "52px minmax(160px, 220px) 86px minmax(220px, 360px) 32px"
              align-items: "center"
              gap: "10px"
          - select: ".lt-filters__conj, .lt-filters__op"
            decl:
              font-size: "var(--fs-text-xs)"
              font-weight: "var(--font-weight-medium)"
              color: "var(--color-text-secondary)"
          - select: ".lt-filters__conj"
            decl:
              text-align: "right"
          - select: ".lt-filters__value"
            decl:
              min-width: "0"
          - select: ".lt-filters__remove.neuron-btn"
            decl:
              width: "32px"
              height: "32px"
              color: "var(--color-text-secondary)"
          - select: ".lt-filters__remove.neuron-btn:hover:not(:disabled)"
            decl:
              color: "var(--color-danger)"
          - select: ".lt-filters__empty"
            decl:
              margin: "0"
              font-size: "var(--fs-text-sm)"
              color: "var(--color-text-tertiary)"
          - select: ".lt-filters__footer"
            decl:
              display: "flex"
              align-items: "center"
              justify-content: "space-between"
              gap: "12px"
              padding-left: "62px"
          - select: ".lt-filters__actions"
            decl:
              display: "flex"
              gap: "var(--space-2)"
          - select: ".lt-fchips"
            note: "Applied filter chips"
            decl:
              display: "flex"
              align-items: "center"
              flex-wrap: "wrap"
              gap: "8px 10px"
              padding: "10px 18px"
              border-bottom: "1px solid var(--color-border)"
          - select: ".lt-fchips__label"
            decl:
              font-size: "var(--fs-text-xs)"
              font-weight: "var(--font-weight-medium)"
              color: "var(--color-text-secondary)"
          - select: ".lt-fchips__list"
            decl:
              display: "flex"
              flex-wrap: "wrap"
              gap: "8px"
              margin: "0"
              padding: "0"
              list-style: "none"
          - select: ".lt-fchip"
            decl:
              display: "inline-flex"
              align-items: "center"
              gap: "4px"
              height: "28px"
              padding: "0 4px 0 10px"
              border: "1px solid var(--color-primary-border)"
              border-radius: "var(--radius-full)"
              background: "var(--color-primary-light)"
              color: "var(--color-nav-active-text)"
              font-size: "var(--fs-text-xs)"
              white-space: "nowrap"
          - select: ".lt-fchip__label"
            decl:
              font-weight: "var(--font-weight-medium)"
          - select: ".lt-fchip__value"
            decl:
              max-width: "260px"
              overflow: "hidden"
              text-overflow: "ellipsis"
              font-weight: "var(--font-weight-semibold)"
          - select: ".lt-fchip__remove"
            decl:
              display: "inline-flex"
              align-items: "center"
              justify-content: "center"
              width: "20px"
              height: "20px"
              padding: "0"
              border: "0"
              border-radius: "var(--radius-full)"
              background: "transparent"
              color: "inherit"
              cursor: "pointer"
          - select: ".lt-fchip__remove:hover"
            decl:
              background: "var(--color-primary-border)"
          - select: ".lt-fchip__remove:focus-visible"
            decl:
              outline: "2px solid var(--color-primary)"
              outline-offset: "1px"
          - select: ".lt-fchips__clear.neuron-btn"
            decl:
              margin-left: "auto"
          - select: ".lt-table"
            note: "Table (NeuronTable inside the card)"
            decl:
              min-width: "0"
              transition: "opacity .15s"
          - select: ".lt-table.is-refreshing, .is-refreshing .lt-cards"
            decl:
              opacity: ".55"
          - select: ".lt-table .neuron-table-container"
            note: "The card is the frame: drop NeuronTable's own border, radius and shadow."
            decl:
              border: "0"
              border-radius: "0"
              box-shadow: "none"
          - select: ".lt-table .neuron-table"
            note: "Fixed layout: every column declares a `width` except one flexible text column, which absorbs the remaining space and ellipsizes. Below --lt-min-width the wrapper scrolls horizontally and the sticky Actions column keeps its shadow. (With auto layout a nowrap cell claimed its full text width and pushed Last Update under Actions.)"
            decl:
              table-layout: "fixed"
              min-width: "var(--lt-min-width, {{template.components.listTable.defaults.minTableWidth}})"
          - select: ".lt-table .neuron-table--md .neuron-table__th"
            note: "Header row: 12px semibold on the subtle band (md size bumps it to 14px)."
            decl:
              font-size: "var(--fs-text-xs)"
              background: "var(--color-bg-subtle)"
              color: "var(--color-text-secondary)"
          - select: ".lt-table .neuron-table__tr:last-child .neuron-table__td"
            decl:
              border-bottom: "0"
          - select: ".lt-table .neuron-table--hoverable .neuron-table__tr:hover .neuron-table__td"
            decl:
              background: "var(--color-primary-light)"
          - select: ".lt-table .neuron-table__tr--clickable"
            decl:
              cursor: "pointer"
          - select: ".lt-table .neuron-table__link, .lt-id"
            note: "Record id link: mono, brand-600 (the hover token) for contrast on white."
            decl:
              font-family: "var(--lab-font-mono)"
              font-size: "13px"
              font-weight: "var(--font-weight-medium)"
              color: "var(--color-primary-hover)"
          - select: ".lt-table .neuron-table__link:hover"
            decl:
              color: "var(--color-nav-active-text)"
          - select: ".lt-cell-primary, .lt-cell-ellipsis"
            decl:
              display: "block"
              overflow: "hidden"
              text-overflow: "ellipsis"
              white-space: "nowrap"
          - select: ".lt-cell-primary"
            decl:
              font-weight: "var(--font-weight-medium)"
          - select: ".lt-cell-id"
            note: "Inside NeuronTable's inline-flex link button the span needs its own cap."
            decl:
              max-width: "100%"
          - select: ".lt-table .neuron-table__link"
            decl:
              max-width: "100%"
          - select: ".lt-cell-mono"
            decl:
              font-family: "var(--lab-font-mono)"
              font-size: "13px"
          - select: ".lt-cell-no"
            decl:
              color: "var(--color-text-secondary)"
              font-variant-numeric: "tabular-nums"
          - select: ".lt-cell-muted"
            decl:
              color: "var(--color-text-secondary)"
          - select: ".lt-cell-empty"
            decl:
              color: "var(--color-text-tertiary)"
          - select: ".lt-cell-stack"
            note: "Two-line cell: value + muted context line."
            decl:
              display: "flex"
              flex-direction: "column"
              min-width: "0"
          - select: ".lt-cell-stack__main"
            decl:
              white-space: "nowrap"
              font-variant-numeric: "tabular-nums"
          - select: ".lt-cell-stack__sub"
            decl:
              font-size: "var(--fs-text-xs)"
              line-height: "var(--lh-text-xs)"
              color: "var(--color-text-secondary)"
              white-space: "nowrap"
              overflow: "hidden"
              text-overflow: "ellipsis"
          - select: ".lt-actions"
            note: "Row actions: 32px icon buttons; brand = the row's main action."
            decl:
              display: "inline-flex"
              justify-content: "flex-end"
              gap: "4px"
          - select: ".lt-action.neuron-btn"
            decl:
              width: "32px"
              height: "32px"
              border: "1px solid transparent"
              border-radius: "var(--radius-md)"
              color: "var(--color-text-secondary)"
          - select: ".lt-action--brand.neuron-btn"
            decl:
              color: "var(--color-primary-hover)"
          - select: ".lt-action.neuron-btn:hover:not(:disabled)"
            decl:
              background: "var(--color-bg-surface-hover)"
              border-color: "var(--color-border)"
              color: "var(--color-text-primary)"
          - select: ".lt-action--danger.neuron-btn:hover:not(:disabled)"
            decl:
              color: "var(--color-danger)"
              border-color: "var(--color-danger-border)"
              background: "var(--color-danger-light)"
          - select: ".lt-action--menu.neuron-btn.is-open"
            note: "\"⋯\" trigger (buttonActionVariant=\"menu\")"
            decl:
              background: "var(--color-bg-surface-hover)"
              border-color: "var(--color-border)"
              color: "var(--color-text-primary)"
          - select: ".lt-rowmenu"
            note: "Row action menu — portalled to <body>, fixed next to its trigger."
            decl:
              position: "fixed"
              z-index: "1050"
              display: "flex"
              flex-direction: "column"
              padding: "4px"
              border: "1px solid var(--color-border)"
              border-radius: "10px"
              background: "var(--color-bg-surface)"
              box-shadow: "0 12px 24px -4px rgba(16, 24, 40, .14), 0 4px 8px -2px rgba(16, 24, 40, .06)"
          - select: ".lt-rowmenu__item"
            decl:
              display: "flex"
              align-items: "center"
              gap: "10px"
              height: "36px"
              padding: "0 10px"
              border: "0"
              border-radius: "6px"
              background: "transparent"
              color: "var(--color-text-primary)"
              font: "inherit"
              font-size: "var(--fs-text-sm)"
              font-weight: "var(--font-weight-medium)"
              text-align: "left"
              cursor: "pointer"
          - select: ".lt-rowmenu__item:hover, .lt-rowmenu__item:focus-visible"
            decl:
              outline: "none"
              background: "var(--color-bg-surface-hover)"
          - select: ".lt-rowmenu__item:focus-visible"
            decl:
              box-shadow: "inset 0 0 0 2px var(--color-primary)"
          - select: ".lt-rowmenu__icon"
            decl:
              display: "inline-flex"
              color: "var(--color-text-secondary)"
          - select: ".lt-rowmenu__item--brand .lt-rowmenu__icon"
            decl:
              color: "var(--color-primary-hover)"
          - select: ".lt-rowmenu__item--danger"
            decl:
              color: "var(--color-danger)"
          - select: ".lt-rowmenu__item--danger .lt-rowmenu__icon"
            decl:
              color: "var(--color-danger)"
          - select: ".lt-rowmenu__item--danger:hover, .lt-rowmenu__item--danger:focus-visible"
            decl:
              background: "var(--color-danger-light)"
          - select: ".lt-footer"
            note: "Footer"
            decl:
              display: "flex"
              align-items: "center"
              justify-content: "space-between"
              flex-wrap: "wrap"
              gap: "16px"
              padding: "14px 18px"
              border-top: "1px solid var(--color-border)"
          - select: ".lt-footer__size"
            decl:
              display: "flex"
              align-items: "center"
              gap: "10px"
          - select: ".lt-footer__label, .lt-footer__range"
            decl:
              font-size: "var(--fs-text-xs)"
              color: "var(--color-text-secondary)"
              white-space: "nowrap"
          - select: ".lt-footer__label"
            decl:
              font-weight: "var(--font-weight-medium)"
          - select: ".lt-footer__range"
            decl:
              font-variant-numeric: "tabular-nums"
          - select: ".lt-psize"
            note: "Rows per page (ListTablePageSize) — design: Work queue footer dropdown."
            decl:
              display: "inline-flex"
              align-items: "center"
              gap: "10px"
          - select: ".lt-psize__anchor"
            decl:
              position: "relative"
              display: "inline-flex"
          - select: ".lt-psize__trigger"
            decl:
              display: "inline-flex"
              align-items: "center"
              gap: "var(--space-2)"
              height: "34px"
              min-width: "68px"
              padding: "0 10px 0 12px"
              border: "1px solid var(--color-border)"
              border-radius: "var(--radius-md)"
              background: "var(--color-bg-surface)"
              color: "var(--color-text-primary)"
              font: "inherit"
              font-size: "var(--fs-text-xs)"
              font-weight: "var(--font-weight-semibold)"
              font-variant-numeric: "tabular-nums"
              cursor: "pointer"
              transition: "border-color .15s, box-shadow .15s"
          - select: ".lt-psize__trigger:hover"
            decl:
              border-color: "var(--color-border-hover)"
          - select: ".lt-psize__trigger.is-open, .lt-psize__trigger:focus-visible"
            decl:
              outline: "none"
              border-color: "var(--color-primary-hover)"
              box-shadow: "0 0 0 3px var(--color-primary-light)"
          - select: ".lt-psize__value"
            decl:
              flex: "1"
              text-align: "left"
          - select: ".lt-psize__chevron"
            decl:
              color: "var(--color-text-tertiary)"
              transition: "transform .15s"
          - select: ".lt-psize__trigger.is-open .lt-psize__chevron"
            decl:
              transform: "rotate(180deg)"
          - select: ".lt-psize__popover"
            note: "opens upward: the footer sits at the bottom of the card"
            decl:
              position: "absolute"
              bottom: "calc(100% + 6px)"
              left: "0"
              z-index: "41"
              min-width: "100%"
              width: "max-content"
              padding: "4px"
              border: "1px solid var(--color-border)"
              border-radius: "10px"
              background: "var(--color-bg-surface)"
              box-shadow: "0 12px 24px -4px rgba(16, 24, 40, .14), 0 4px 8px -2px rgba(16, 24, 40, .06)"
          - select: ".lt-psize__caption"
            decl:
              padding: "6px 10px 4px"
              font-size: "11px"
              font-weight: "var(--font-weight-medium)"
              letter-spacing: ".06em"
              text-transform: "uppercase"
              color: "var(--color-text-tertiary)"
              white-space: "nowrap"
          - select: ".lt-psize__list"
            decl:
              margin: "0"
              padding: "0"
              list-style: "none"
              outline: "none"
          - select: ".lt-psize__option"
            decl:
              display: "flex"
              align-items: "center"
              justify-content: "space-between"
              gap: "var(--space-4)"
              height: "34px"
              padding: "0 10px"
              border-radius: "6px"
              color: "var(--color-text-primary)"
              font-size: "13px"
              font-weight: "var(--font-weight-medium)"
              font-variant-numeric: "tabular-nums"
              cursor: "pointer"
          - select: ".lt-psize__option.is-active"
            decl:
              background: "var(--color-bg-surface-hover)"
          - select: ".lt-psize__option.is-selected"
            decl:
              background: "var(--color-primary-light)"
              color: "var(--color-nav-active-text)"
              font-weight: "var(--font-weight-semibold)"
          - select: ".lt-psize__list:focus-visible .lt-psize__option.is-active"
            note: "keyboard focus ring on the active option"
            decl:
              box-shadow: "inset 0 0 0 2px var(--color-primary)"
          - select: ".lt-psize__check"
            decl:
              color: "var(--color-primary-hover)"
          - select: ".lt-footer__pages"
            decl:
              display: "flex"
              align-items: "center"
              gap: "6px"
          - select: ".lt-page"
            decl:
              min-width: "34px"
              height: "34px"
              padding: "0 8px"
              border: "1px solid transparent"
              border-radius: "var(--radius-md)"
              background: "transparent"
              color: "var(--color-text-secondary)"
              font: "inherit"
              font-size: "var(--fs-text-xs)"
              font-weight: "var(--font-weight-medium)"
              font-variant-numeric: "tabular-nums"
              cursor: "pointer"
          - select: ".lt-page:hover"
            decl:
              background: "var(--color-bg-surface-hover)"
          - select: ".lt-page.is-active"
            decl:
              background: "var(--color-primary-light)"
              color: "var(--color-nav-active-text)"
              font-weight: "var(--font-weight-semibold)"
          - select: ".lt-page:focus-visible"
            decl:
              outline: "2px solid var(--color-primary)"
              outline-offset: "2px"
          - select: ".lt-page--gap"
            decl:
              display: "inline-flex"
              align-items: "center"
              justify-content: "center"
              cursor: "default"
          - select: ".lt-page--gap:hover"
            decl:
              background: "transparent"
          - select: ".lt-footer__nav"
            decl:
              display: "flex"
              align-items: "center"
              gap: "var(--space-2)"
          - select: ".lt-state"
            note: "States"
            decl:
              padding: "18px"
          - select: ".lt-state--inline"
            decl:
              padding-bottom: "0"
          - select: ".lt-empty"
            decl:
              display: "flex"
              flex-direction: "column"
              align-items: "center"
              justify-content: "center"
              padding: "48px 24px"
              text-align: "center"
          - select: ".lt-empty__icon"
            decl:
              width: "56px"
              height: "56px"
              margin-bottom: "12px"
              display: "flex"
              align-items: "center"
              justify-content: "center"
              border-radius: "var(--radius-full)"
              background: "var(--color-bg-subtle)"
              color: "var(--color-text-tertiary)"
          - select: ".lt-empty__title"
            decl:
              margin: "0 0 4px"
              font-size: "var(--fs-text-md)"
              font-weight: "var(--font-weight-semibold)"
              color: "var(--color-text-primary)"
          - select: ".lt-empty__body"
            decl:
              margin: "0 0 16px"
              max-width: "360px"
              font-size: "var(--fs-text-sm)"
              color: "var(--color-text-secondary)"
          - select: ".lt-cards"
            note: "Mobile cards (< 768px)"
            decl:
              margin: "0"
              padding: "0"
              list-style: "none"
          - select: ".lt-card"
            decl:
              display: "flex"
              gap: "12px"
              padding: "14px 16px"
              border-bottom: "1px solid var(--color-border)"
          - select: ".lt-card:last-child"
            decl:
              border-bottom: "0"
          - select: ".lt-card.is-selected"
            decl:
              background: "var(--color-primary-light)"
          - select: ".lt-card__no"
            decl:
              flex-shrink: "0"
              min-width: "24px"
              padding-top: "1px"
              font-size: "var(--fs-text-xs)"
              font-weight: "var(--font-weight-medium)"
              color: "var(--color-text-secondary)"
              font-variant-numeric: "tabular-nums"
          - select: ".lt-card__check"
            decl:
              flex-shrink: "0"
              padding-top: "2px"
          - select: ".lt-card__body"
            decl:
              flex: "1"
              min-width: "0"
          - select: ".lt-card__main"
            decl:
              display: "flex"
              flex-direction: "column"
              gap: "2px"
              width: "100%"
              padding: "0"
              border: "0"
              background: "transparent"
              color: "inherit"
              font: "inherit"
              text-align: "left"
              cursor: "pointer"
          - select: ".lt-card__top"
            decl:
              display: "flex"
              align-items: "center"
              justify-content: "space-between"
              gap: "var(--space-2)"
          - select: ".lt-card__id"
            decl:
              min-width: "0"
              overflow: "hidden"
              text-overflow: "ellipsis"
              white-space: "nowrap"
              font-family: "var(--lab-font-mono)"
              font-size: "var(--fs-text-xs)"
              font-weight: "var(--font-weight-medium)"
              color: "var(--color-primary-hover)"
          - select: ".lt-card__title"
            decl:
              margin-top: "2px"
              font-size: "15px"
              font-weight: "var(--font-weight-medium)"
              color: "var(--color-text-primary)"
          - select: ".lt-card__sub, .lt-card__meta"
            decl:
              font-size: "13px"
              color: "var(--color-text-secondary)"
          - select: ".lt-card__title, .lt-card__sub, .lt-card__meta"
            note: "long URLs / query strings have no spaces: let them wrap inside the card"
            decl:
              overflow-wrap: "anywhere"
          - select: ".lt-card__meta"
            decl:
              font-weight: "var(--font-weight-medium)"
          - select: ".lt-card__actions"
            decl:
              display: "flex"
              flex-wrap: "wrap"
              gap: "var(--space-2)"
              margin-top: "10px"
          - select: ".lt-card__action.neuron-btn"
            decl:
              flex: "1 1 auto"
              height: "44px"
              white-space: "nowrap"
          - select: ".lt-card__action--brand.neuron-btn"
            decl:
              color: "var(--color-primary-hover)"
          - select: ".lt-card__action--danger.neuron-btn"
            decl:
              color: "var(--color-danger)"
          - media: "(max-width: {{template.layout.breakpoints.mobile}})"
            rules:
              - select: ".lt-toolbar__right"
                note: "search on its own line, primary action full width under it"
                decl:
                  flex-basis: "100%"
                  flex-wrap: "wrap"
              - select: ".lt-toolbar__search"
                decl:
                  flex-basis: "100%"
                  max-width: "none"
              - select: ".lt-toolbar__right > .neuron-btn"
                decl:
                  flex: "1 1 100%"
                  justify-content: "center"
              - select: ".lt-filters__row"
                note: "filter rows stack: field + remove on one line, operator + value below"
                decl:
                  grid-template-columns: "minmax(0, 1fr) 32px"
                  grid-template-areas: "\"field remove\" \"value value\""
              - select: ".lt-filters__conj, .lt-filters__op"
                decl:
                  display: "none"
              - select: ".lt-filters__field"
                decl:
                  grid-area: "field"
              - select: ".lt-filters__value"
                decl:
                  grid-area: "value"
              - select: ".lt-filters__remove"
                decl:
                  grid-area: "remove"
              - select: ".lt-filters__footer"
                decl:
                  padding-left: "0"
                  flex-wrap: "wrap"
              - select: ".lt-fchips__clear.neuron-btn"
                decl:
                  margin-left: "0"
      - id: detail
        file: src/components/detail/Detail.css
        importedBy: [src/components/detail/DetailCard.tsx, src/components/detail/DetailHeader.tsx, src/components/detail/DetailTable.tsx, src/components/detail/OverviewBlocks.tsx, src/components/detail/ViewToggle.tsx]
        note: "Halaman detail: header, tabs, grid overview, card, key-value, entity card, view toggle, skeleton."
        rules:
          - select: ".dt-page"
            note: "Record page — Neudela Logistics Dashboard shipment detail, on neudela tokens (same hex → token mapping as list-table/ListTable.css)."
            decl:
              gap: "20px"
          - select: ".dt-sr-only"
            decl:
              position: "absolute"
              width: "1px"
              height: "1px"
              padding: "0"
              margin: "-1px"
              overflow: "hidden"
              clip: "rect(0, 0, 0, 0)"
              white-space: "nowrap"
              border: "0"
          - select: ".dt-header"
            note: "Header"
            decl:
              display: "flex"
              flex-direction: "column"
              gap: "8px"
          - select: ".dt-header__row"
            decl:
              display: "flex"
              flex-wrap: "wrap"
              align-items: "flex-start"
              justify-content: "space-between"
              gap: "16px"
          - select: ".dt-header__main"
            decl:
              flex: "1 1 360px"
              min-width: "0"
          - select: ".dt-header__title-row"
            decl:
              display: "flex"
              align-items: "center"
              flex-wrap: "wrap"
              gap: "6px 12px"
              min-width: "0"
          - select: ".dt-header__title"
            decl:
              margin: "0"
              font-size: "var(--fs-display-xs)"
              line-height: "32px"
              font-weight: "var(--font-weight-semibold)"
              letter-spacing: "-0.02em"
              color: "var(--color-text-primary)"
              text-wrap: "balance"
          - select: ".dt-header__id"
            decl:
              display: "inline-flex"
              align-items: "center"
              gap: "2px"
              min-width: "0"
              max-width: "100%"
          - select: ".dt-header__id-text"
            decl:
              overflow: "hidden"
              text-overflow: "ellipsis"
              white-space: "nowrap"
              font-family: "var(--lab-font-mono)"
              font-size: "13px"
              line-height: "24px"
              color: "var(--color-text-secondary)"
          - select: ".dt-copy"
            decl:
              flex-shrink: "0"
              display: "inline-flex"
              align-items: "center"
              justify-content: "center"
              width: "24px"
              height: "24px"
              padding: "0"
              border: "0"
              border-radius: "6px"
              background: "transparent"
              color: "var(--color-text-tertiary)"
              cursor: "pointer"
          - select: ".dt-copy:hover"
            decl:
              background: "var(--color-bg-surface-hover)"
              color: "var(--color-text-primary)"
          - select: ".dt-copy:focus-visible"
            decl:
              outline: "2px solid var(--color-primary)"
              outline-offset: "1px"
          - select: ".dt-header__desc"
            decl:
              margin: "4px 0 0"
              max-width: "80ch"
              font-size: "var(--fs-text-sm)"
              line-height: "var(--lh-text-sm)"
              color: "var(--color-text-secondary)"
              text-wrap: "pretty"
          - select: ".dt-header__actions"
            decl:
              display: "flex"
              flex-wrap: "wrap"
              gap: "var(--space-2)"
          - select: ".dt-tabs"
            note: "Tabs"
            decl:
              display: "flex"
              gap: "4px"
              overflow-x: "auto"
              overflow-y: "hidden"
              border-bottom: "1px solid var(--color-border)"
              scrollbar-width: "thin"
          - select: ".dt-tab"
            decl:
              display: "inline-flex"
              align-items: "center"
              gap: "var(--space-2)"
              flex-shrink: "0"
              height: "40px"
              padding: "0 12px"
              margin-bottom: "-1px"
              border: "0"
              border-bottom: "2px solid transparent"
              background: "transparent"
              color: "var(--color-text-secondary)"
              font: "inherit"
              font-size: "var(--fs-text-sm)"
              font-weight: "var(--font-weight-medium)"
              cursor: "pointer"
          - select: ".dt-tab:hover"
            decl:
              color: "var(--color-text-primary)"
          - select: ".dt-tab.is-active"
            decl:
              border-bottom-color: "var(--color-primary-hover)"
              color: "var(--color-text-primary)"
              font-weight: "var(--font-weight-semibold)"
          - select: ".dt-tab:focus-visible"
            decl:
              outline: "2px solid var(--color-primary)"
              outline-offset: "-2px"
              border-radius: "6px 6px 0 0"
          - select: ".dt-tab__icon"
            decl:
              display: "inline-flex"
          - select: ".dt-tab__count"
            decl:
              padding: "0 7px"
              border-radius: "var(--radius-full)"
              background: "var(--color-bg-surface-hover)"
              color: "var(--color-text-secondary)"
              font-size: "var(--fs-text-xs)"
              line-height: "18px"
              font-weight: "var(--font-weight-medium)"
              font-variant-numeric: "tabular-nums"
          - select: ".dt-tab.is-active .dt-tab__count"
            decl:
              background: "var(--color-primary-light)"
              color: "var(--color-nav-active-text)"
          - select: ".dt-panel"
            decl:
              min-width: "0"
          - select: ".dt-panel:focus-visible"
            decl:
              outline: "2px solid var(--color-primary)"
              outline-offset: "4px"
              border-radius: "var(--radius-lg)"
          - select: ".dt-overview"
            note: "Overview grid"
            decl:
              display: "flex"
              flex-wrap: "wrap"
              align-items: "flex-start"
              gap: "20px"
          - select: ".dt-overview__main"
            decl:
              flex: "2 1 560px"
              min-width: "0"
              display: "flex"
              flex-direction: "column"
              gap: "20px"
          - select: ".dt-overview__aside"
            decl:
              flex: "1 1 320px"
              min-width: "0"
              display: "flex"
              flex-direction: "column"
              gap: "20px"
          - select: ".dt-overview--aside-only .dt-overview__aside"
            note: "only side cards: they sit side by side across the full width"
            decl:
              display: "grid"
              grid-template-columns: "repeat(auto-fit, minmax(320px, 1fr))"
              align-items: "start"
          - select: ".dt-card"
            note: "Card"
            decl:
              min-width: "0"
              background: "var(--color-bg-surface)"
              border: "1px solid var(--color-border)"
              border-radius: "var(--radius-lg)"
              box-shadow: "var(--shadow-sm)"
          - select: ".dt-card__head"
            decl:
              display: "flex"
              align-items: "center"
              justify-content: "space-between"
              flex-wrap: "wrap"
              gap: "12px"
              padding: "14px 20px"
              border-bottom: "1px solid var(--color-border)"
          - select: ".dt-card__title-row"
            decl:
              display: "flex"
              align-items: "center"
              flex-wrap: "wrap"
              gap: "var(--space-2)"
              min-width: "0"
          - select: ".dt-card__title"
            decl:
              margin: "0"
              font-size: "var(--fs-text-md)"
              line-height: "var(--lh-text-md)"
              font-weight: "var(--font-weight-semibold)"
              color: "var(--color-text-primary)"
          - select: ".dt-card__actions"
            decl:
              display: "flex"
              align-items: "center"
              flex-wrap: "wrap"
              gap: "var(--space-2)"
          - select: ".dt-card__body"
            decl:
              padding: "16px 20px"
          - select: ".dt-card__body--flush"
            note: "Flush body (tables): clip the square cell backgrounds to the card's inner corners. Safe for the rows-per-page popover — it only appears past 10 rows, inside the body."
            decl:
              padding: "0"
              overflow: "hidden"
              border-bottom-left-radius: "calc(var(--radius-lg) - 1px)"
              border-bottom-right-radius: "calc(var(--radius-lg) - 1px)"
          - select: ".dt-card__body--flush .neuron-table-container"
            note: "tables run edge to edge inside the card: drop NeuronTable's own frame"
            decl:
              border: "0"
              border-radius: "0"
              box-shadow: "none"
          - select: ".dt-link"
            decl:
              padding: "4px"
              border: "0"
              background: "transparent"
              color: "var(--color-nav-active-text)"
              font: "inherit"
              font-size: "13px"
              font-weight: "var(--font-weight-semibold)"
              cursor: "pointer"
          - select: ".dt-link:hover"
            decl:
              text-decoration: "underline"
          - select: ".dt-link:focus-visible"
            decl:
              outline: "2px solid var(--color-primary)"
              outline-offset: "2px"
              border-radius: "4px"
          - select: ".dt-search"
            decl:
              width: "260px"
              max-width: "100%"
              flex: "0 1 260px"
          - select: ".dt-empty"
            decl:
              margin: "0"
              padding: "28px 20px"
              font-size: "var(--fs-text-sm)"
              color: "var(--color-text-tertiary)"
              text-align: "center"
          - select: ".dt-kv"
            note: "Key / value list"
            decl:
              margin: "0"
              padding: "6px 20px 10px"
          - select: ".dt-card__body:has(> .dt-kv)"
            decl:
              padding: "0"
          - select: ".dt-kv__row"
            decl:
              display: "flex"
              justify-content: "space-between"
              align-items: "baseline"
              gap: "12px"
              padding: "9px 0"
              border-bottom: "1px solid color-mix(in srgb, var(--color-border) 55%, transparent)"
          - select: ".dt-kv__row:last-child"
            decl:
              border-bottom: "0"
          - select: ".dt-kv dt"
            decl:
              flex-shrink: "0"
              font-size: "13px"
              color: "var(--color-text-secondary)"
          - select: ".dt-kv dd"
            decl:
              margin: "0"
              min-width: "0"
              font-size: "13px"
              font-weight: "var(--font-weight-medium)"
              color: "var(--color-text-primary)"
              text-align: "right"
              font-variant-numeric: "tabular-nums"
              overflow-wrap: "anywhere"
          - select: ".dt-kv dd.is-mono"
            decl:
              font-family: "var(--lab-font-mono)"
              font-size: "var(--fs-text-xs)"
              color: "var(--color-primary-hover)"
          - select: ".dt-kv dd a"
            decl:
              color: "inherit"
          - select: ".dt-kv__sub"
            decl:
              display: "block"
              font-size: "var(--fs-text-xs)"
              font-weight: "var(--font-weight-regular)"
              color: "var(--color-text-secondary)"
          - select: ".dt-entity-grid"
            note: "Entity cards (referenced records)"
            decl:
              display: "grid"
              grid-template-columns: "repeat(auto-fill, minmax(280px, 1fr))"
              gap: "16px"
          - select: ".dt-entity"
            decl:
              min-width: "0"
              padding: "16px 18px"
              border: "1px solid var(--color-border)"
              border-radius: "var(--radius-lg)"
              background: "var(--color-bg-surface)"
          - select: ".dt-entity__head"
            decl:
              display: "flex"
              align-items: "flex-start"
              gap: "12px"
              margin-bottom: "12px"
          - select: ".dt-entity__icon"
            decl:
              flex-shrink: "0"
              display: "flex"
              align-items: "center"
              justify-content: "center"
              width: "36px"
              height: "36px"
              border-radius: "var(--radius-md)"
              background: "var(--color-primary-light)"
              color: "var(--color-primary-hover)"
          - select: ".dt-entity__heading"
            decl:
              min-width: "0"
          - select: ".dt-entity__title"
            decl:
              margin: "0"
              font-size: "15px"
              line-height: "22px"
              font-weight: "var(--font-weight-semibold)"
              color: "var(--color-text-primary)"
              overflow-wrap: "anywhere"
          - select: ".dt-entity__sub"
            decl:
              margin: "2px 0 0"
              font-size: "var(--fs-text-xs)"
              color: "var(--color-text-secondary)"
          - select: ".dt-entity__fields"
            decl:
              display: "grid"
              grid-template-columns: "auto minmax(0, 1fr)"
              gap: "6px 12px"
              margin: "0"
          - select: ".dt-entity__field"
            decl:
              display: "contents"
          - select: ".dt-entity__field dt"
            decl:
              font-size: "13px"
              color: "var(--color-text-secondary)"
          - select: ".dt-entity__field dd"
            decl:
              margin: "0"
              font-size: "13px"
              color: "var(--color-text-primary)"
              overflow-wrap: "anywhere"
          - select: ".dt-entity__field dd.is-mono"
            decl:
              font-family: "var(--lab-font-mono)"
              font-size: "var(--fs-text-xs)"
              line-height: "20px"
          - select: ".dt-view-toggle .neuron-btn-group-item.is-active"
            note: "View toggle (NeuronButtonGroup) — active item on nav-active tokens"
            decl:
              background: "var(--color-nav-active-bg)"
              color: "var(--color-nav-active-text)"
              border-color: "var(--color-primary-border)"
              box-shadow: "none"
          - select: ".dt-skel"
            note: "Loading skeleton"
            decl:
              border-radius: "var(--radius-md)"
              background: "linear-gradient( 90deg, color-mix(in srgb, var(--color-border) 45%, transparent) 25%, color-mix(in srgb, var(--color-border) 20%, transparent) 37%, color-mix(in srgb, var(--color-border) 45%, transparent) 63% )"
              background-size: "400% 100%"
              animation: "dt-shimmer 1.4s ease infinite"
          - select: ".dt-skel--crumb"
            decl:
              width: "220px"
              height: "14px"
          - select: ".dt-skel--title"
            decl:
              width: "360px"
              max-width: "100%"
              height: "28px"
          - select: ".dt-skel--text"
            decl:
              width: "520px"
              max-width: "100%"
              height: "14px"
          - select: ".dt-skel--tabs"
            decl:
              width: "100%"
              height: "40px"
          - select: ".dt-skel--card"
            decl:
              height: "220px"
              border-radius: "var(--radius-lg)"
          - keyframes: dt-shimmer
            frames:
              - select: "0%"
                decl:
                  background-position: "100% 50%"
              - select: "100%"
                decl:
                  background-position: "0 50%"
          - media: "(prefers-reduced-motion: reduce)"
            rules:
              - select: ".dt-skel"
                decl:
