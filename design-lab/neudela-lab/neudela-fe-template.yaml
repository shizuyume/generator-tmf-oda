              color: "var(--color-primary-hover)"
          - select: ".dt-timeline"
            note: "Timeline (design \"Tracking\")"
            decl:
              margin: "0"
              padding: "16px 20px 4px"
              list-style: "none"
          - select: ".dt-timeline__item"
            decl:
              display: "flex"
              gap: "14px"
          - select: ".dt-timeline__rail"
            decl:
              display: "flex"
              flex-direction: "column"
              align-items: "center"
          - select: ".dt-timeline__dot"
            decl:
              flex-shrink: "0"
              display: "flex"
              align-items: "center"
              justify-content: "center"
              width: "28px"
              height: "28px"
              border-radius: "var(--radius-full)"
              background: "var(--color-bg-surface-hover)"
              color: "var(--color-text-secondary)"
          - select: ".dt-timeline__item:first-child .dt-timeline__dot"
            decl:
              background: "var(--color-primary-light)"
              color: "var(--color-primary-hover)"
          - select: ".dt-timeline__line"
            decl:
              flex: "1"
              width: "2px"
              min-height: "14px"
              margin: "4px 0"
              background: "color-mix(in srgb, var(--color-border) 70%, transparent)"
          - select: ".dt-timeline__body"
            decl:
              display: "flex"
              flex-direction: "column"
              min-width: "0"
              padding-bottom: "16px"
          - select: ".dt-timeline__title"
            decl:
              font-size: "var(--fs-text-sm)"
              font-weight: "var(--font-weight-semibold)"
              color: "var(--color-text-primary)"
