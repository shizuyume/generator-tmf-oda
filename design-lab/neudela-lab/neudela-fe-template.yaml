# -------------------------------------------------------------------------------------
# KNOWN GAPS — selisih yang disadari antara template saat ini dan OAS/backend.
# applied: false = template SENGAJA belum mengubahnya (hasil generate = template).
# -------------------------------------------------------------------------------------
knownGaps:
  - id: hub-list-not-in-oas
    detail: "OAS TMF736 hanya mendefinisikan POST /hub dan DELETE /hub/{id}."
    fix: "backend hasil generate melayani GET /hub (TMF630 paging + filter) dan GET /hub/{id} dalam bentuk Hub OAS (id, href, callback, query, @type); FE: list + halaman record hub; Overview menandai keduanya 'Not in spec'"
    applied: true
  - id: hub-fvo-type
    detail: "Hub_FVO mewarisi Extensible (@type wajib)."
    fix: "\"@type\": { const: Hub } di app.pages.hub.form.payload; backend menerima @type di CreateSubscriptionDto"
    applied: true
  - id: error-reason
    detail: "TMF Error mewajibkan code + reason; client membaca message → error → 'HTTP {status}'. reason tidak dibaca."
    fix: "message || reason || error || 'HTTP {status}'"
    applied: false
  - id: backend-filters
    detail: "Backend hasil generate dulu hanya mendukung name, q, id (parity B-07)."
    fix: "common/filter: TMF630 JSONPath filter= + attribute style pada atribut whitelist dari IR; FE + mock memakai grammar yang sama"
    applied: true
  - id: no-edit-form
    detail: "PATCH tersedia di service, tetapi belum ada form edit di UI."
    applied: false
  - id: policy-api-unverified
    detail: "Base path Policy Management (/tmf-api/policyManagement/v5) dan nama resource-nya belum dikonfirmasi dengan service sungguhan."
    applied: false
  - id: lov-async-search
    detail: "NeuronDropdown tidak punya async search; picker hanya memakai hasil load awal (q='', limit 20)."
    applied: false
  - id: server-dates
    detail: "createdDate dan lastUpdate bukan bagian OAS; ditambahkan backend. UI menyembunyikan baris timeline bila kosong."
    applied: n/a

# -------------------------------------------------------------------------------------
# VERIFICATION — kriteria "hasil pasti"
# -------------------------------------------------------------------------------------
verification:
  golden: design-lab/neudela-lab
  checks:
    - "Generate app TMF736 dari file ini → setiap file di generation.output identik dengan neudela-lab."
    - "template.styles → setiap selector, deklarasi, dan urutan rule sama dengan 6 file CSS lab (komentar boleh beda)."
    - "theme.emit diff-against-package → tidak ada override token untuk template ini (palette + colors = neudela@0.2.0)."
    - "npm run build (tsc + vite build) lulus."
    - "E2E (Playwright, dev:mock :4010): list (filter, chip, sort, refresh, menu ⋯, pagination, rows per page), detail (breadcrumb nama, tab, overview), form (summary error, LOV, payload FVO tanpa href), dark mode (kelas di html+body, transisi serentak, scrollbar)."
