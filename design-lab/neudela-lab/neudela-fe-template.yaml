          - select: ".dt-timeline__sub"
            decl:
              font-size: "var(--fs-text-xs)"
              color: "var(--color-text-tertiary)"
          - media: "(max-width: {{template.layout.breakpoints.mobile}})"
            rules:
              - select: ".dt-stat"
